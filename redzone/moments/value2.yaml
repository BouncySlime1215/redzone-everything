# Value v2 numbers: base points, grading bonuses, the interim leverage tables and the stakes multipliers.
# Source: docs/plans/2026-11-09-value-v2.md sections 1, 3 and 4. Every number is a starting prior to be fitted
# (section 5), which is why it lives here and not in value2.py. A moment's value = base x leverage x stakes.
version: 1
leagues: {nfl: football, cfb: football, nba: hoops, wnba: hoops, cbb: hoops}
regulation: {nfl: [4, 900], cfb: [4, 900], nba: [4, 720], wnba: [4, 600], cbb: [2, 1200]}   # periods, seconds each

# Replay value: what a moment is worth aired later as a short catch-up clip, not cut to live.
# replay = base x leverage ** replay_leverage_exponent x stakes; dead value replays at 0. At 0.3 a garbage-time
# interception (base 5, leverage 0.3) is live 1.5 but replay 3.48 (Nick, Nov 9: "notable play... replay worthy").
# A prior to be fitted on what RedZone and league highlight lists replay. Nothing reads it at runtime.
replay_leverage_exponent: 0.3

football:
  base:
    td_off: 5.0              # offensive touchdown
    td_def: 7.0              # defensive or special-teams touchdown
    interception: 4.0
    fumble_lost: 4.0
    strip_sack: 3.0          # the lost fumble's own points come on top
    turnover_on_downs: 3.0   # a 4th-down try that was stopped
    goal_line_stand: 4.0     # stopped on downs after 3+ snaps inside the 5 (replaces turnover_on_downs)
    fourth_try: 3.0          # a 4th-down try that converted
    fake_kick: 4.0           # a run or pass out of punt or field-goal formation
    two_point: 3.0
    fg_missed: 3.0           # missed or blocked
    safety: 5.0
    blocked_punt: 4.0
    onside: 3.0
    onside_recovered: 6.0    # recovered by the kicking team
    last_play_heave: 3.0     # deep pass or lateral on the last play of a half (the feed never says "Hail Mary")
    third_long: 1.5          # 3rd-and-7+ converted
    sack: 1.0
    dpi_long: 1.5            # defensive pass interference of 30+ yards
    ejection: 2.0
    ot_start: 3.0
  bands:                     # [at least, points], the last band reached wins
    fg_made: [[0, 1.0], [40, 2.0], [50, 3.0]]        # kick distance in yards
    explosive: [[20, 1.0], [40, 2.5]]                # yards gained, no touchdown
  bonus:
    td_off_20: 1.0           # touchdown of 20+ yards
    td_off_50: 2.0           # 50+ (instead of the 20+ point)
    td_off_4th: 1.0
    td_off_last_play: 2.0    # last play of a half
    td_def_50: 1.0
    turnover_inside_20: 1.0  # snapped inside either 20
    turnover_return_20: 1.0  # returned 20+ yards
    sack_late_down: 0.5      # on 3rd or 4th down
    two_point_ties_or_leads: 2.0   # a made two-point try that ties the game or takes the lead (play text "ATTEMPT SUCCEEDS");
                                   # a failed try keeps the plain two_point points (Nick, Nov 9: TD + failed try stays top 3)
  limits:
    td_long: 20
    td_very_long: 50
    red_edge: 20             # "inside either 20": 20 or fewer yards from either end zone
    return_long: 20
    goal_line: 5
    stand_snaps: 3
    third_long_distance: 7
    dpi_long: 30
    heave_from: 30           # the heave starts at least this far from the end zone
    one_score: 8
  dead:                      # flat, never multiplied
    dead_kneel: -1.0
    dead_review: -0.5        # a review that upheld the call

hoops:
  base:
    game_winner: 8.0         # go-ahead basket at the buzzer of the last period or overtime
    go_ahead: 5.0            # go-ahead or tying basket in the last minute
    go_ahead_last10: 6.0     # the same in the last 10 seconds
    clutch_fg: 2.0           # made basket, last 5 minutes or overtime, margin 5 or less
    clutch_ft: 2.0           # each free throw, last 10 seconds, margin 3 or less
    lead_change: 0.5         # lead change or tie, early
    lead_change_late: 3.0
    comeback: 4.0            # down 15+ cut to 5 or less
    period_buzzer: 3.0       # made basket as a period ends
    alley_oop: 1.5
    dunk: 0.5
    deep_three: 1.0          # 28+ feet
    four_point_play: 2.0
    steal_score: 1.0         # a steal and the stealing team scores within a few seconds
    technical: 2.0
    flagrant: 2.0
    ejection: 2.0
    star_points: 3.0         # a player's 40th, 50th, 60th point
    triple_double: 3.0       # clinched: 10+ points, rebounds and assists
    ot_start: 3.0
  runs: [[8, 2.0], [12, 3.0], [15, 4.0]]     # unanswered points -> total for the run so far; each line crossed adds the difference
  bonus:
    clutch_and1: 1.0
    clutch_three: 0.5
    buzzer_half_court: 1.0
    ot_each_further: 1.0
  limits:
    late_left: 300           # "late": seconds left in the last period (or any overtime)
    clutch_margin: 5
    last_minute: 60
    last_seconds: 10
    clutch_ft_margin: 3
    buzzer_clock: 1.0        # a basket with this much clock or less is "at the buzzer"
    comeback_from: 15
    comeback_to: 5
    deep_three_feet: 28
    half_court_feet: 47
    steal_score_within: 7    # game-clock seconds from the steal to the basket
    star_points: [40, 50, 60]
    triple_double_each: 10
    one_score: 3
  dead:
    dead_ft: -0.25           # a free throw outside clutch time
    dead_review: -0.5        # a challenge or review that changed nothing

# Leverage, interim (spec section 3): a margin-by-time table per family until our own win-probability model exists.
# Columns: the margin is in the first column whose margin_max holds it, else the last column.
# Rows: one more than the thresholds; a row is passed when the regulation time left is at or under its threshold.
# left_frac are fractions of regulation (so college halves and WNBA quarters land in the same rows), left_secs are seconds.
# Overtime reads the last row. An unknown clock reads 1.0.
leverage:
  floor: 0.3
  cap: 3.0
  football:
    margin_max: [3, 8, 16, 24]
    left_frac: [0.5, 0.25]
    left_secs: [300, 120]
    table:
      - [1.0, 1.0, 1.0, 0.8, 0.6]    # first half
      - [1.2, 1.2, 1.0, 0.7, 0.5]    # third quarter
      - [1.6, 1.5, 1.0, 0.6, 0.4]    # fourth quarter, more than 5:00
      - [2.3, 2.2, 0.9, 0.4, 0.3]    # 5:00 to 2:00
      - [3.0, 3.0, 0.7, 0.3, 0.3]    # last 2:00 and overtime
  hoops:
    margin_max: [3, 6, 10, 15, 20]
    left_frac: [0.5, 0.25]
    left_secs: [300, 120, 60]
    table:
      - [1.0, 1.0, 1.0, 0.9, 0.8, 0.6]    # first half
      - [1.2, 1.1, 1.0, 0.9, 0.7, 0.5]    # third quarter
      - [1.6, 1.4, 1.1, 0.8, 0.5, 0.4]    # last quarter, more than 5:00
      - [2.2, 1.8, 1.1, 0.6, 0.4, 0.3]    # 5:00 to 2:00
      - [2.7, 2.0, 0.9, 0.4, 0.3, 0.3]    # 2:00 to 1:00
      - [3.0, 2.2, 0.7, 0.3, 0.3, 0.3]    # last minute and overtime

# Stakes (spec section 4): only what the summary really carries. The largest that applies wins; otherwise 1.0.
stakes:
  postseason: 1.5            # header.season.type 3 (postseason) or 5 (play-in)
  postseason_types: [3, 5]
  ranked_vs_ranked: 1.4      # both header competitors carry a rank of 1-25 (college only)
  ranked_max: 25
  upset: 1.5                 # underdog of upset_spread+ leading or within one score, last period or overtime
  upset_spread: 7.0

# Spec rows no detector fires on, and what data each would need. Printed by scripts/value2_report.py.
not_detectable:
  football:
    - [Fight, "the feed has unsportsmanlike conduct and unnecessary roughness, not fights", "a play text or tag that says fight"]
    - [Red-zone trip (suspense), "a state, not a payoff: nothing is scored for it here", "the suspense head, spec build step 6"]
    - [Completed Hail Mary named as one, "the feed never says Hail Mary; a last-play deep pass is scored as last_play_heave", "a play tag"]
    - [Commercial break, "play-by-play has timeouts, not what the broadcast showed", "broadcast-side ad detection"]
  hoops:
    - [Poster dunk, "play text says dunk, never over whom", "tracking or video tags"]
    - [Chase-down block, "play text says blocks, never how", "tracking or video tags"]
    - [Scuffle, "only its technicals, flagrants and ejections are in the feed", "a play tag"]
    - [Career mark, "the summary has tonight's box score only", "player season and career totals"]
    - [Triple-double by steals or blocks, "only points, rebounds and assists are counted from the plays", "small: count steals and blocks too"]
    - [Fast break named as one, "the feed has no fast-break tag; a score within 7 game seconds of a steal is scored as steal_score", "a play tag"]
    - [Commercial break, "play-by-play has timeouts, not what the broadcast showed", "broadcast-side ad detection"]
  stakes:
    - [Elimination or championship game, "every archived dev night is regular season, so the round fields could not be checked", "one archived postseason night"]
    - [Clinch or elimination on the line tonight, "the summary has standings, not the clinching scenarios", "a scenario feed or our own standings math"]
    - [Rivalry, "no list exists in the repo", "a fixed list per league from Nick"]
    - [Record or milestone chase, "no season or career totals in the summary", "player season and career totals"]
