    min_value: 0.8         # catchup_pack.PackParams
    lead_s: 2.0            # catchup_pack.PackParams
    tail_s: 3.0            # catchup_pack.PackParams
    possession_s: 24.0     # catchup_pack.PackParams
    snap_s: 7.0            # catchup_pack.PackParams
    merge_s: 12.0          # catchup_pack.PackParams
    seg_max_s: 30.0        # catchup_pack.PackParams
    big_w: 2.0             # catchup_pack.PackParams
    lead_w: 1.0            # catchup_pack.PackParams
    tie_w: 0.5             # catchup_pack.PackParams
    run_w: 1.0             # catchup_pack.PackParams
    run_pts: 8             # catchup_pack.PackParams
    max_age_s: 180.0       # catchup_pack.PackParams
    multi_max_age_s: null    # catchup_pack.PackParams: null = no cap (the code's inf; a JSON settings view cannot carry inf)
    delay_s: 35.0          # catchup_pack.PackParams
    rewind_rule: "measured"  # catchup_pack.PackParams
    reach_s: 175.0         # catchup_pack.PackParams
    seek_base_s: 12.0      # catchup_pack.PackParams
    seek_per_s: 0.079      # catchup_pack.PackParams
    seek_gap_s: 8.0        # catchup_pack.PackParams
    reel: false            # catchup_pack.PackParams
    reel_lag_s: 720.0      # catchup_pack.PackParams
    reel_play_s: 10.0      # catchup_pack.PackParams
    reel_open_s: 20.0      # catchup_pack.PackParams
    reel_gap_s: 8.0        # catchup_pack.PackParams
    moments: false         # catchup_pack.PackParams
    moments_lag_s: 60.0    # catchup_pack.PackParams
    moments_play_s: 12.0   # catchup_pack.PackParams
    moments_open_s: 20.0   # catchup_pack.PackParams
    moments_gap_s: 6.0     # catchup_pack.PackParams
  fast_steps: false        # [PARK-SPEED] OFF. On: fewer seconds on the critical path, every check kept (docs/park.md "Fast
                           # steps"). A jump returns once the new picture is up, playing, on the new input and silence is read
                           # back after the switch (the TV's own after-switch read is used instead of a second read queued
                           # behind it; the new stick's playing report and the left stick's pause are read during the flip);
                           # the stick left's BACK and read-back run after the jump, and a later step on that stick waits for
                           # them (or ends them before their next key: a new tune, finish). Reads poll every steps.fast_poll_s;
                           # a read-back reads the stick and its foreground app at once; the TV's mute, volume, power and input
                           # are read in one round. Off: every step as before (replay decision-identical)
  steps:                 # each PARK device step as measured on the real sticks and TV on Nov 10 (ledger L13-L21, L41-L51)
    min_real_pos_s: 60     # after a tune the media session says "playing" at position 0.0 for about 2 s: a position under this
                           # is never a stream's place
    live_lag_s: 20         # an unread stream's nominal place: its live edge this far behind YouTube's clock (19-27 s measured;
                           # park.timing.live_lag wins when set). A read replaces it
    first_report_s: 8      # ...a tune with no real position within this long is a failed tune
    poll_s: 0.25           # the media session is read this often while a step waits on it (the runner read 4 times a second)
    fast_poll_s: 0.1       # [park.fast_steps] ...this often with it on (one read takes about 0.2 s, so reads run back to back)
    tune_timeout_s: 90     # one way of tuning (direct code, local search, search) gets at most this long
    read_steps: 2          # the read gesture's LEFT presses (CENTER, LEFT x this, read the label, CENTER); 0 = no read
    left_step_s: 15        # one committed LEFT is exactly this far back (69 of 69). [PARK-UNIFY] its ONE home: the show's
                           # planner reads it too (ShowParams.step; park.show.step is only an alias)
    center_wait_s: 1.3     # after the first CENTER: the overlay comes up and the player pauses
    left_gap_s: 0.6        # between LEFT presses
    label_wait_s: 0.7      # after the last LEFT, before the label is read
    label_timeout_s: 25    # one label read (screenshot, on-Mac text reading, frame deleted) gets at most this long
    land_wait_s: 4         # after the committing CENTER: playing again within this
    settle_s: 2.5          # ...then this long before checking the commit did not toggle a pause
    replay_wait_s: 6       # a resume or pause key's report is waited for this long
    read_age_min_s: 5      # a label with no programme start: the start is the 5-minute grid point before (capture - label)
    read_age_max_s: 240    # ...when that leaves a frame this many seconds old or between (worked on nbc, 58.8 s behind)
    grid_s: 300            # programmes start on this grid
    base_lag_min_s: 5      # a fresh tune's read is believed when the picture is this far behind YouTube's clock (less the seek)...
    base_lag_max_s: 90     # ...up to this
    kept_lag_max_s: 600    # a stream found already on the game is believed up to this far behind (one was 120 s behind, run 6)
    pause_lead_s: 0.70     # the frozen frame is this far past the pause key: the 2023 stick (and any model not named below)
    pause_lead_plus_s: 0.60   # ...the 4K Plus
    back_after_s: 0.4      # BACK clears the pause banner this long after the pause key...
    confirm_s: 1.6         # ...then the stick is read back (still paused, YouTube TV in front) this long after BACK
    resume_lead_s: 0.3     # a jump: the resume key goes out this long before the flip command. [PARK-UNIFY] its ONE home:
                           # the planner reads it too (ShowParams.resume_lead; park.show.resume_lead only an alias)
    hold_key_s: 1.35       # ...and the pause key to the stick being left this long after the flip command (60 of 60)
    flip_methods: [smartthings]   # the TV's own input change; never HOME on a stick
    input_rereads: 2       # an input the sound readback did not return is read again this many times...
    input_reread_s: 0.7    # ...this far apart
  leagues: [nba, cbb]      # [PARK-CONTROLLER, unit 8] the leagues whose live games the PARK show takes. [PARK-NFL] nfl / cfb may be
                           # added: football facts are the grader's NFL dead time, never past the play clock unexplained
                           # (park.play_clock_s 40 + park.snap_slack_s 5), padding about 3 s (park.timing.stamp_sd_football 0.4)
  session_min: 240         # one show plans on a grid this many minutes long; the engine starts the next one when it ends
  possession_cap_s: 30     # after a review's RULING the stoppage is over: silence after it (and the plays it re-logs) is dead only
                           # this long from the last row; the rest is UNKNOWN, never a place to cut. 24 s shot clock + 6 s
                           # (inbound, stamp slack). Night 20261023 LAC @ LAL Q1 7:21: a timeout, a challenge ruled 32 s later,
                           # then 149 s of silence trusted as dead up to the review cap (420 s): a mid-play leave
  late_row_s: 60           # a feed row stamped more than this after a row that FOLLOWS it in the feed's order is a late edit (a
                           # substitution re-stamped half an hour on; 30 such rows in four games on Nov 10): it takes the stamp
                           # of the row before it instead of dragging every later row up to its own (live run 4, flip 4)
  # [PARK-CONFIG-KEYS] the PARK facts' numbers (noggin/park_facts.FactsParams), read as park.<name>: the code's defaults
  high_play_s: 7.0         # park_facts.FactsParams
  shot_window_s: 4.0       # park_facts.FactsParams
  ghost_s: 60.0            # park_facts.FactsParams
  open_lead_s: -1.0        # park_facts.FactsParams
  football_lead_s: 15.0    # park_facts.FactsParams
  play_clock_s: 40.0       # park_facts.FactsParams
  snap_slack_s: 5.0        # park_facts.FactsParams
  play_after_s: 12.0       # park_facts.FactsParams
  play_after_special_s: 15.0  # park_facts.FactsParams
  idle_poll_s: 5           # with park.enabled off the engine's park loop only sleeps, and looks at the flag this often
  start_retry_s: 30        # the stream on screen could not be placed (no read, no fresh tune): try again after this long
  football_slider: 50      # [football slider] football nights (Nick, Nov 11): 0 = "More everything else" ... 100 = "More football".
                           # Football's value x 16^((s-50)/50) (1/16 .. 16); the ends are weights, not anchors, so at 100 the
                           # other games still backfill football's long breaks when a whole look fits. 50 = value decides,
                           # unchanged. Shown in Settings only with park.enabled and a football game live
  seen: false              # [SEEN] OFF. On: the show tracks what you have seen of each game (redzone/noggin/seen.py): when it was
                           # last on screen, the score then, what the feed reported since, a staleness score, the big plays
                           # missed; the Show tab says "seen 7 min ago" and a templated recap ("Last time: LAL 31-25, 1Q 0:30.
                           # Since: LAC 12-4 run"; no AI text). Decisions are unchanged
  director_v1: false       # [DIRECTOR] OFF. On: Director v1 (redzone/noggin/director.py) weighs every game at each choice by
                           # (a) a big moment pending, (b) how long it has gone unseen, (c) score.league_weight; turns park.seen
                           # on. Rule #1, the padding and the warrant are unchanged; each jump's warrant names its goal (a/b/c)
  director:                # [DIRECTOR] Director v1's numbers (picked in replay on 3 recorded NBA nights; not measured on the TV)
    big_w: 3.0             # (a) a game with a close-and-late or overtime play in the feed's last big_look seconds: x this
    big_look: 90           # ...seconds (park.show.crunch_look)
    fresh_w: 1.0           # (b) a game unseen is weighted up to x (1 + this)...
    stale_ref: 600         # ...at this many staleness points (a second of play unseen adds its leverage: ~10 min of ordinary play)
    taste: true            # (c) each game x its league's score.league_weight over the best league on the slate
  feed_lag:              # [PARK-NFL-LAG] a late feed's game is parked deeper so its dead time is known before it is shown
    enabled: false         # OFF. On: each game of a listed league starts from its league's feed lag in redzone/lab/feed_lag_profile.json
                           # (Nov 2-3: nfl median 44 s, q90 62.5 s; n=150) instead of park.show.feed_lag (8 s), and is parked
                           # (lag - 8 s) deeper: Prime by a longer pause hold, YouTube TV by more LEFT presses. The lag is then
                           # measured live from each new row's stamp to its first sight. Off: every game as before
    leagues: [nfl, cfb]    # basketball is not listed: its rows do not change
    prior_q: 90            # the profile's quantile to start from
    min_samples: 5         # new rows seen before the measured lag replaces the prior
    move_s: 5              # ...and only when it moved this much
  prime:                   # [PRIME-PARK] Prime Video games in the PARK show (redzone/noggin/park_prime.py)
    enabled: false         # OFF. On: the show also takes live games with a Prime event link (prime:<gti>). A Prime tune is the
                           # existing Prime tuner, its cost decider.switch_cost.prime plus a pause-hold (prime_pause, in
                           # buffered_jump.hold_chunk_s chunks); no back route (replay.apps); its place from the epoch position;
                           # its K from the hidden stick's own score-bug reads (sync.edge.k_min_reads / k_sd_max_s bars).
                           # Off: decision-identical to before (tests/test_park_prime.py). Unproven on the TV
    pair_offset_s: 60.0    # K from a paused frame's bug: decider.sync.clock_sample only returns delays of 2-180 s, so the frame's
                           # epoch is shifted by this before the call and taken off again (K may be negative: -58 to +120 s fit)
    stop_match_s: 1.0      # a parked frame's bug clock this close to the stoppage's own clock is inside that stoppage (a whole-second
                           # clock read)
    pin_football: true     # [pinned anchor] (only with park.prime.enabled on) a Prime FOOTBALL game on screen when the show starts is
                           # kept on its stick: never held paused when left (it plays on unseen, then is parked again before the way
                           # back), re-tuned (about 100 s on Prime) only at the lateness cap; all roaming is on the other stick.
                           # Replay, fake sticks, 3 nights, lag 44 s: football snaps with 3 NBA games 0.11 -> 0.19 (slider 50) and
                           # 0.26 (slider 100); all value seen 0.46 -> 0.52; both judges 0 / 0 / 0; behind live max 143 s
    bug_gate: false        # [PARK-NFL-LAG] OFF. On: a parked Prime FOOTBALL frame is kept only if its score bug's play clock is
                           # below 40 (counting down from a dead ball; at 40 a play runs). Unread: kept (the feed's facts rule).
                           # The play clock was readable on 76% of frames of one Thursday replay (watcher, Nov 11); unproven live
  show:                    # the show's own numbers (redzone/noggin/park_show.py ShowParams; each as the local show runner ended
                           # Nov 10 on, its READY-B state). Pace is a soft pull, never a rule (Nick, Nov 10)
    show_delay: 35         # the whole show runs this far behind each stream's live edge, so the feed is complete for what is
                           # on screen and the per-tune read (which steps the stream back) costs nothing extra
    bonus: 3.0             # the planner's jump bonus: the soft pull toward pace; it only chooses among WARRANTED jumps
    min_look: 3.0          # seconds of play a look must show before the next jump (whole possessions stay)
    warrant: need          # need: no jump without a warrant worked out before it (Nick, Nov 10: "If we jump the warrant
                           # has to exist") | note: only write it down | off
    crunch: true           # in crunch time the best game is the anchor: the others only fill its stoppages
    stops: true            # trust an open stoppage for the shortest time its kind has lasted (stop_min below)
    land_wait: 20          # no landing more than this before a play start the feed has reported (never onto a long break)
    long_break: 90         # stopped this long at the feed's edge with no restart reported = a long break: nothing is parked there
    tune_stick: 1.0        # a new tune must be worth this many jump bonuses more than the best plan without one (no thrash)
    late_cap: 145          # nothing comes up further behind its stream's live edge than this (Nick's lateness cap)
    jump_real: 3.0         # a jump on the real TV, first key to the new picture: 2.4-3.5 s (ledger L45); the plan uses this.
                           # [PARK-UNIFY] the flip's other times come from it and resume_lead_s by ONE derivation
                           # (ShowParams.flip_times: flip, unseen, hold-off), used by the app's rig and the replay's
    read: 10.5             # the per-tune read gesture, first key to playing again (a tune with it took 13-19 s). Where the
                           # read leaves a stream: ONE formula, ShowParams.read_back (LEFT steps x left_step_s + read_sat)
    # [PARK-CONFIG-KEYS] the rest of park_show.ShowParams, each the code's default (step, resume_lead: park.steps.*)
    unseen: 1.7            # park_show.ShowParams
    dead_w: 0.0            # park_show.ShowParams
    stale: 99999           # park_show.ShowParams
    back_spots: 2          # park_show.ShowParams
    roll_same: true        # park_show.ShowParams
    wide_pad: 10           # park_show.ShowParams
    wide_prospect: 0.3     # park_show.ShowParams
    confirm: 2             # park_show.ShowParams
    hold_off: 4            # park_show.ShowParams
    read_sat: 8.0          # park_show.ShowParams
    jump_slack: 1          # park_show.ShowParams
    pause_reach: 180.0     # park_show.ShowParams
    hold_ok: 1.0           # park_show.ShowParams
    hold_drift: 2.0        # park_show.ShowParams
    lag_sane: 60           # park_show.ShowParams
    lag_read_max: 300.0    # park_show.ShowParams
    lag_early: 10.0        # park_show.ShowParams
    refresh: 15            # park_show.ShowParams
    cool: 10               # park_show.ShowParams
    tune_retry: 20         # park_show.ShowParams
    keep_margin: 5         # park_show.ShowParams
    stay_say: 15           # park_show.ShowParams
    clip_reach: 150        # park_show.ShowParams
    clip_steps_max: 9      # park_show.ShowParams
    crunch_look: 90        # park_show.ShowParams
    feed_lag: 8.0          # park_show.ShowParams
    poll: 2.5              # park_show.ShowParams
    tune0_code: 3.5        # park_show.ShowParams
    tune0_search: 19.5     # park_show.ShowParams
    my_pref: 1.25          # park_show.ShowParams
    stop_max:              # the sanity gate: the longest an OPEN stoppage of each kind can plausibly last (s). "No row since"
                           # means "still stopped" only this long; after it the feed has gone quiet or lost a row, and the rest
                           # is unknown (never a place to cut). Plain caps set above the longest real stretch of each kind on
                           # one recorded night (20261023, four games: whistle 219 s, timeout 258, review 346, period end 223,
                           # halftime 1046); the stoppage model has the real spread
      whistle: 240         # a foul, a violation, out of bounds, free throws
      unknown: 240
      timeout: 300
      review: 420
      injury: 900
      end_period: 300
      halftime: 1500
    stop_min:              # "<league>|<feed row type>": the shortest dead time (s) such a row was followed by on the NBA dev
                           # nights (1st percentile, never above any one night's; learned by the local show runner, Nov 10)
      "nba|coach's challenge (overturned)": 9.0
      "nba|end period": 3.0
      "nba|free throw - 1 of 3": 4.0
      "nba|free throw - 2 of 3": 4.0
      "nba|free throw - technical": 6.0
      "nba|kicked ball": 4.0
      "nba|offensive charge": 11.0
      "nba|offensive foul": 8.0
      "nba|out of bounds - lost ball turnover": 3.0
      "nba|out of bounds - step turnover": 6.0
      "nba|personal foul": 9.0
      "nba|personal take foul": 14.0
      "nba|shooting foul": 4.0
