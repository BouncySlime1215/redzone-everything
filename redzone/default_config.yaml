# RedZone Everything — default settings.
# Your edits live in data/config.yaml (made on first run). Every save from the
# phone is checked against the limits in config.py and versioned so it can be undone.

mode:
  dry_run: true            # true = show what it WOULD do, never touch the TV
  leagues: {nfl: true, nba: true, nhl: true, mlb: true, cbb: true, cfb: true, wcbb: false}   # [Nick N2] women's college basketball off

sunday_ticket: true        # you have NFL Sunday Ticket (+ RedZone) on YouTube TV
market: raleigh-durham

server:
  port: 8777

teams:                     # your teams: biggest boost
  nfl: [WSH]
  nba: [WSH]
  nhl: [WSH]
  mlb: [WSH]
  cbb: [UNC]               # college: ESPN abbreviations (North Carolina = UNC, ESPN team id 153)
  cfb: [UNC]
  wcbb: [UNC]

college:                   # college boards are huge: only your teams' games and ranked games are followed
  groups:                  # ESPN conference ids to also poll, so an unranked team of yours still shows
    cbb: ["2"]             # ACC (men's basketball)
    cfb: ["1"]             # ACC (football)
    wcbb: ["2"]            # ACC (women's basketball)
  top_n: 25                # follow games with a team ranked this high or better

polling:
  hot_s: 3                 # what's on, what's next, and tense games: every N seconds
  live_s: 10               # every other live game
  idle_s: 300              # poll every N seconds when nothing is live
  nba_pbp_s: 1             # [Nick 9:05 AM Nov 5] 1 s, conditional GET (ETag/If-Modified-Since); NBA liveData play-by-play per live NBA game (sources.nba_primary / nba_shadow)
  league_fast: true        # [Nick 9:05 AM] league pbp on its own loop at nba_pbp_s / nhl_pbp_s (engine._league_fast_loop)
  nhl_pbp_s: 3             # NHL api-web play-by-play per live NHL game (sources.nhl_primary); 8 s when off
  burst:                   # [sync 5] the on-screen game + its top challenger, only while a stoppage is likely
    enabled: false         # (break forecast p >= break_p) or it's tense: summary + league pbp every every_s
    every_s: 1.5           # floor 1 s; the poll loop runs at this rate while any burst game exists
    break_p: 0.5
    max_games: 2

sync:
  probe:
    enabled: true          # [SYNC] read-only log of what the sticks expose (media_session, Wi-Fi, UI tree, logcat)
                           # -> recordings/<day>/sync_probe.jsonl. Presses nothing; skips during switches.
    visible_ui: false      # also dump the VISIBLE stick's UI tree (off: unmeasured whether a dump stutters video)
    logcat_anchors: false  # [yttv anchors] ad edges from the player's logcat lines (YouTube TV has no UI text);
                           # off until the probe's logged lines show YTTV's real ad strings
    log_ad_start: ""       # regex override for an ad-start log line ("" = sync_probe.LOG_AD_START)
    log_ad_end: ""         # ... and an ad-end line ("" = sync_probe.LOG_AD_END)
    bursts: true           # [burst anchor] YTTV MediaSession bursts (content-tied, live lab Nov 4) -> logged as
                           # "burst" rows in sync_anchors.jsonl with the feed's dead ball they follow
    burst_gap_s: 300.0     # a quiet gap this long before an update makes it a new burst's onset
    burst_after_tune_s: 30.0   # updates this soon after a tune, seek or pause are the player settling
    burst_confirm_s: 60.0  # ...and a second update within this confirms it (a burst has 4-8)
    burst_sd_s: 0.3        # the onset's doubt on the stick's own clock (burst vs position: 0.1-0.4 s)
    log_edge_sd_s: 1.0     # an ad edge read from the player's own log line: the player logs it as it renders it
  edge:                    # [SYNC A, EXP-800, Nick Nov 5 2:10 AM] each stick vs its stream's live edge (redzone/sync_edge.py)
    enabled: true          # shadow: read-only `cat /proc/uptime; dumpsys media_session` per stick -> data/sync_truth/edge/,
                           # and the measured behind_live_s per stick -> Controller.behind_live
    every_s: 1.0           # one read per stick per tick (the controller reads media_session as often)
    settle_s: 3.0          # a tune counts once it has played this long
    force_live_s: 2.0      # [step B, Nick 2:30 AM] behind the live edge by more than the app's own hold by this much
                           # -> would_force in the row; acted on only with the flags below
    force_live: false      # [step B, EXP-801] re-link the HIDDEN stick to live (never one held on purpose)
    force_live_visible: false   # ...and the stick on screen, only on a dead ball (restore_visible relink, ~2.5 s)
    force_gap_s: 60.0      # at most one re-link per game per this long
    # [Prime epoch, Nick Nov 5 3:30 AM] Prime's position is the frame's wall clock: E = screen behind the frame clock
    # (~6.4 s, sd ~0.1). Each score-bug clock/score delay sample read while a fresh epoch row exists gives
    # K = arena - frame clock = delay - E; K is fused per target (inverse variance). Rows log k_s and epoch_delay_s.
    midpoint: false        # [Nov 8] a read's time = the midpoint of its adb round trip (its end, today)
    meter: false           # [Nov 8] E = wall - position into the sync filter (YouTube TV's live edge, Prime's epoch): anchors
                           # then only set the per-tune constant. Off until tonight's rows grade it
    meter_every_s: 2.0     # at most one meter read per target this often
    meter_sd_s: 0.3        # doubt of one meter read before the round trip's own
    epoch_signal: false    # feed E + K to the sync filter as an "epoch" sample (off until tonight's rows grade it)
    k_pair_s: 30.0         # an epoch row this recent pairs with a score-bug sample
    k_min_reads: 5         # K counts once this many samples are fused ...
    k_sd_max_s: 0.5        # ... and its doubt (1 sd) is under this (Nick's target: <= 0.5 s after ~20 reads)
    epoch_every_s: 10.0    # at most one epoch sample per target this often (K's error is shared by all of them)
  break_anchor:            # [auto-anchors] ad break on screen <-> the feed's dead ball -> a delay sample
    enabled: false         # logged always (recordings/<day>/sync_anchors.jsonl); fed to the filter only when on.
    start_bias_s: 15       # whistle -> ad on screen, a PRIOR until the Wednesday probe data refits it
    bias_sd_s: 10
    min_s: 10              # plausible whistle -> ad-on-screen window (feed wall to screen time)
    max_s: 240
  burst_anchor:            # [burst anchor] a burst onset <-> the feed's last dead ball -> a delay sample
    enabled: false         # off until a live night shows bursts line up with TV timeouts (scripts/burst_align.py)
    gap_s: 15              # dead ball -> burst on screen: a PRIOR; burst_align.py fits it
    gap_sd_s: 10
  drift_alarm:             # [SYNC 6] delay moved > limit_s since it synced, or the stick's network predicts it
    limit_s: 5
    resync: false          # re-tune the hidden stick's standby on an alarm (off until a live night shows alarms are real)

sources:
  fastcast: false          # ESPN's push feed: new plays the moment ESPN publishes them. Runs NEXT TO polling
                           # (polling never stops). Off until the live check passes: see redzone/sources/fastcast.py
  fastcast_check: true     # with fastcast off: run it in SHADOW on a few live games (logged, never merged) and grade
                           # it against polling -> data/fastcast_check.json (redzone/sources/fastcast_check.py)
  fastcast_auto_enable: false  # turn fastcast on by itself once that check passes
  nhl_primary: false       # NHL api-web live play-by-play (~17 s behind the ice vs ESPN's ~43 s) owns NHL
                           # stoppages while fresh and feeds its plays to the timeline (docs/timing.md, A2)
  trust_order: {nfl: [], nba: [], nhl: []}   # [FEED-01/03] e.g. nhl: [nhl, espn_summary]: fastest measured first owns
                           # stoppages while fresh; on its errors/silence the next takes over; disagreements logged
  nba_primary: true        # [Nick 9:05 AM Nov 5: primary for every NBA game; Wed lags p50 12 s vs ESPN 36 s] NBA liveData play-by-play (real event times, published ~4-12 s after) owns NBA
                           # stoppages while fresh and feeds the timeline; OFF until a backtest + live night pass
  nba_shadow: true         # primary off: still poll it and log its plays (source nba_cdn) to plays.jsonl
  nhl_shadow: true         # primary off: still poll api-web every polling.nhl_pbp_s and log each event's
                           # first-seen time (data/recordings/<day>/nhl_seen.jsonl) for the gating backtest
fast_feeds:                # [tracker item 5, Nov 5] league feeds polled faster than ESPN, in SHADOW: each new event's
                           # first-seen time goes to data/recordings/<day>/fast_feeds.jsonl, never to the merger
                           # (redzone/sources/fastfeeds.py; scripts/fast_feed_race.py measures the lag race vs ESPN)
  enabled: false           # OFF until Nick or lane 4 turns it on for a shadow night
  leagues: [nhl, mlb]      # which feeds run while enabled. NBA is left out: lane 2's polling.league_fast (#326)
                           # already polls nba_cdn at 1 s into plays.jsonl, which the race reads; don't poll it twice
  nba_s: 1                 # NBA liveData play-by-play (public S3 mirror), per live game
  nhl_s: 2                 # NHL api-web play-by-play, per live game
  mlb_s: 3                 # MLB statsapi feed/live, per live game
  board_s: 15              # each league's scoreboard / schedule (game id lookup)
  max_games: 8             # per league, so a full slate can't multiply the request rate

score:
  neutral_cap: 0.9         # a neutral game tops out at 90; 90-100 is reserved for games you care about
  # Your league order (NFL > CFB > NBA > NCAA hoops > NHL > MLB): a game's live moment is multiplied
  # by its league's weight, so a dull game stays dull but an equal moment goes to the league you
  # like more. Your teams and bets have their own boosts below.
  league_weight: {nfl: 1.15, cfb: 1.10, nba: 1.05, cbb: 1.0, nhl: 0.95, mlb: 0.9, wcbb: 0.9}
  personal_cap: 30
  smoothing_half_life_s: 30
  stakes:
    both_good_pct: 0.600
    both_good: 0.08
    both_bad_pct: 0.350
    both_bad: -0.10
    close_spread: 3.0
    close_spread_bonus: 0.05
    big_spread: 10.0
    big_spread_penalty: -0.05
    national_tv: 0.03
    min: 0.8
    max: 1.2
  postseason:              # redzone/scoring/postseason.py: series state, round, ranked matchups (idea: ArenaSwap)
    enabled: false         # OFF until scored on playoff nights; the hook adds at most `cap` to the stakes multiplier
    base: 0.02             # any postseason game
    elimination: 0.05      # a loss ends someone's season
    decider: 0.05          # winner takes it (Game 7, a one-game final)
    round_step: 0.02       # round bonus = max_round_bonus - round_step * rounds left
    max_round_bonus: 0.08  # the title game / series
    ranked_both: 0.03      # college: both teams in the top 25
    ranked_top10_both: 0.02
    cap: 0.15
  garbage:                 # decided games stop competing for the TV (your team's too); bets/fantasy still count
    moment_mult: 0.12
    comeback_boost: 12     # when a blowout gets close again
    comeback_s: 240
  personal:
    my_team: 25            # scaled by how competitive the game is (0 in a blowout)
    # ...times this per league, in your order: Commanders > UNC football > Wizards > UNC hoops >
    # Capitals > Nationals.
    my_team_league: {nfl: 1.0, cfb: 0.92, nba: 0.84, cbb: 0.78, wcbb: 0.6, nhl: 0.72, mlb: 0.64}
    bet_max: 20
    fantasy_mine: 12
    fantasy_opponent: 8
    manual_boost: 15
    # Prime NBA multiview (tuners.prime_multiview): who may share it. Personal data, so the shipped
    # defaults are empty; put yours in data/config.yaml. Entries are "league:ABBR" (the feed's
    # team abbreviation).
    multiview_exclude: []  # a game with one of these teams never joins a multiview (it goes on the other stick)
    multiview_pin: []      # a game with one of these teams gets a tile first
  nfl:
    time: {q1: 5, q2: 10, q2_two_min: 25, q3: 15, q4_early: 25, q4_mid: 35, q4_late: 55, ot: 60}
    field: {own: 5, opp_mid: 12, opp_deep: 20, red_zone: 30, inside_10: 38, goal_to_go: 7}
    down: {third_short: 6, fourth_go: 15}
    two_minute_drill: 15
    uncertainty: 15
    wp_swing: {threshold: 0.15, points: 15, fade_s: 120}
    player_going_off: 8
  nba:
    time: {early: 8, q3: 12, q4: 25, q4_5min: 45, q4_2min: 58, q4_30s: 68, ot: 65}
    last_shot: 15
    run_10: 15
    run_14: 20
    run_fade_s: 120
    comeback: 12
    uncertainty: 10
    player_going_off: 12
  nhl:
    time: {p1: 8, p2: 12, p3_early: 20, p3_mid: 30, p3_5min: 42, p3_2min: 52, ot: 70, shootout: 75}
    power_play: 15
    five_on_three: 25
    power_play_p3_close: 22
    power_play_lock_within: 2   # a power play holds the TV (and is worth a visit) within this many goals
    imminent_pp_s: 30           # a power play's first N s of game clock count as an imminent goal chance
    # ...and stay "imminent" this long after: a chase skips the whistle hold only then. -1 = off: the
    # skip added 2 mid-play entries to the Nov 1 demo (WPG @ CAR, UTA @ PHI) and caught no extra goal.
    imminent_hold_s: -1
    empty_net: 30
    penalty_shot: 40
  mlb:
    leverage_scale: 2.2
    inning_mult: {early: 0.85, mid: 1.0, eighth: 1.1, ninth_plus: 1.2}
    walk_off_spot: 15
    no_hitter: {through_6: 25, through_7: 35, ninth: 50}
  context:                 # [F-01] the extra moment points every league shares (redzone/scoring/engine.py context()); each number is the code's own fallback
    lead_change_cap: 8     # most points a back-and-forth game can add
    lead_change_fade_s: 150  # a lead change counts as "just flipped" for this long
    fresh_flip: 0          # points for a lead that just changed hands (0 = off)
    upset_min_spread: 3    # an upset is brewing only when the pregame spread was at least this
    upset_full_spread: 10  # ...and counts in full at this spread
    overtime: 4            # overtime / extras, every league
    nfl: {wp_leverage: 0, lead_change_each: 0, upset: 0}
    nba: {wp_leverage: 0, lead_change_each: 0, upset: 8, late_within_6: 4}   # late_within_6: within 6 under 3:00 of the 4th
    nhl: {wp_leverage: 15, lead_change_each: 2.0, upset: 8, late_one_goal: 10}   # late_one_goal: within a goal in the last 5:00 of the 3rd
    mlb: {wp_leverage: 6, lead_change_each: 0, upset: 8}

scoring:                   # [F-01] display switches read by the phone (redzone/web/phone_v2.py)
  watch_value: false       # the /slate view shows each live game's learned watch value (Scored.watch_value); display only, the code's own fallback

control:                   # [F-01] how long a switch may run before the app gives up on it (engine._switch_deadline, supervisor, platform/health, lab/night)
  max_switch_s: 150        # a switch that never reports back is given up on after this long (the code's own fallback)
  max_start_switch_s: 75   # ...and a first pick, with nothing confirmed on screen yet, after this long (the code's own fallback)

brain:                     # learned models (redzone/scoring/brain.py, trained by scripts/train_brain.py)
  enabled: false           # feed the brain's game flow / key-moment / break odds into the score and break forecast
  version: 3               # 3 = Brain v3 (brain_models/<league>.v3.npz: stoppage odds/type/length, entry point,
                           # big plays) where a league has one, else v2; 2 = v2 only
  # Which leagues use each v3 part (scorecards + held-out nights, Nov 3; see docs/brain3/REPORT.md):
  v3_score: [nfl]               # v3's big-play odds / game flow feed the score (else v2's). NBA/NHL stay on
                                # v2's: v3 there cost NBA +2 missed plays and NHL +1 mid-play entry
  v3_break_odds: []             # v3's long-break odds in the break forecast (else v2's, which are better
                                # calibrated on held-out nights: NFL ECE 0.10 vs 0.26, NBA AUC 0.82 vs 0.77)
  v3_lengths: [nfl, nba]        # v3's time-to-restart replaces the fixed break-length table (breaks.LEN);
                                # NHL keeps the table (its median was measured on the same archive)
  v3_entry: []                  # v3's time-to-restart as the expected end of a stoppage the data hasn't closed.
                                # Off: uncapped it cost NFL your-team big plays and NBA mid-play entries, p10
                                # cost NFL dead air, and p50 capped changed nothing. For the decision core to use
  v3_entry_q: 50                # ...its 10th or 50th percentile
  v3_entry_cap: true            # ...never later than the measured table median (it can only shorten a stop)
  hot_points: 0            # moment points at game flow 100 (minus at 0; 50 = a median moment adds nothing)
  key_points: 6            # moment points when a key moment in the next few minutes is a sure thing
  break_weight: 0.5        # log-odds weight of the brain's break odds where the rules also see a break coming,
                           # for leagues without a fitted break_blend (where the rules see nothing, the brain alone)
  # Fitted log-odds blend where the rules see a break coming: logit p = a + b*logit(brain) + c*logit(rules)
  # (scripts/eval_break_blend.py: forward folds on archive nights that are neither locked nor brain-training,
  # Nov 4 2026). Held-out ECE, 50/50 -> fixed log-odds 0.5 -> this: NFL .169 -> .063 -> .054,
  # NBA .126 -> .024 -> .023, NHL .144 -> .095 -> .027.
  break_blend:
    nfl: {a: 1.002, b: 0.3282, c: 0.9161}
    nba: {a: 0.8576, b: 0.6289, c: 1.1204}
    nhl: {a: 0.2209, b: 0.9402, c: 0.0351}
  hot_reason_min: 85       # game flow at least this hot shows up in the reason line
  # Per league (tuned on scripts/eval.py + eval_sports.py, Nov 3 2026): NFL's hand-tuned crunch logic
  # did best untouched (the brain only shows its numbers and helps the break forecast there).
  nfl: {hot_points: 0, key_points: 0}
  nba: {hot_points: 0, key_points: 12}
  nhl: {hot_points: 0, key_points: 6}
  mlb: {hot_points: 0, key_points: 6}
  # College: no replay-tested tuning yet, so the brain only shows its numbers there.
  cbb: {hot_points: 0, key_points: 0}
  wcbb: {hot_points: 0, key_points: 0}
  cfb: {hot_points: 0, key_points: 0}

reasoner:                  # live game reasoner (redzone/reasoner): lock_in per live game, rebuilt each play
  enabled: false           # add lock_in points to the score (the fast head decides; scorecards in the PR)
  must_points: 8           # moment points for must_see (never more than max_points; hard cap 15)
  watch_points: 3          # moment points for watch
  max_points: 12
  yield_to_your_team: true # while your team's game is live and not decided, other games get no lock_in points
  break_discount: 0        # scale lock_in points down by the brain's break odds (0 = off)
  by_odds: 0               # 1 = points grow with the head's odds above odds_floor (crunch counts as sure)
  odds_floor: 0.5
  redzone_share: 1.0       # RedZone gets this share of its best NFL game's lock_in points (it shows that play, no ads)
  during_breaks: false     # lock_in points while the game is in a real break (off: they only bought commercials)
  model: true              # ask the local model (agent/llm_server.py, adapter game-reasoner) for the phone text
  decide_with: head        # head (scorecard-tested) or model: whose lock_in the score uses
  server_url: http://127.0.0.1:8779
  min_interval_s: 20       # at most one model call per hot game this often (a score asks sooner)
  max_tokens: 160
  # Cross-fitted scorecards on integration/next, Nov 3 (docs/reasoner.md). NFL: every setting that
  # raised big plays live also raised commercials (it pulled the TV off RedZone), so storyline only.
  nfl: {must_points: 0, watch_points: 0}
  nba: {must_points: 0, watch_points: 0}      # no gain on the NBA scorecard: storyline only
  nhl: {must_points: 0, watch_points: 0}      # after PR #3 (entries mid-play 11 -> 5 already): 4 pts gave 5 -> 4 but big live -0.6

decider:
  switch_margin: 10
  mine_late_closeness: 0.2   # [D-11] "your team late and close": closeness at or above this (Decider._mine_late)
  fail_cooldown_s: 90        # [F-01] a target whose switch failed is not tried again for this long (engine.py; the code's own fallback)
  safe_auto_resume_s: 600    # [F-01] safe mode (decider.auto_resume) resumes itself after this long (engine.py; the code's own fallback)
  entry:
    enabled: true             # [D-11] the entry timing itself (off: every switch goes straight in)
    allow_live_fallback: false  # [D-01] Rule #1: no go-in-live exit without this (crunch_now live/rewind, max_wait_s, rewind_only, no_wait_leagues, imminent chases)
    leagues: [nfl]            # [D-11] full cut timing (entries, holding for a big play, stretching a stoppage)
    rewind: true              # [D-11] an entry may land with a short DVR rewind to the dead ball before the play
    fastest_s: 4              # [D-11] the picture can come up this soon after the command
    max_rewind_s: 120         # [D-11] the furthest an entry rewinds to reach a dead ball
    relaxed_margin_s: 8       # [D-11] the "centred" pass's delay doubt
    urgent_margin_s: 2        # [D-11] the "urgent" pass's delay doubt
    thin_margin_leagues: [nba, nhl, nfl]   # [D-08] only these leagues (gated) may land on the centred / urgent thin margin
    visit_min_s: 90           # [D-11] a stop expected to run at least this much longer is worth a visit
    no_wait_leagues: []       # [D-11] needs allow_live_fallback: enter live unless a rewind lands it clean
    hold_only: [nhl, nba, mlb]     # switches IN wait for a whistle (never inside crunch's last 2:00); [] turns it off. MLB: D-02
    whistle_band_s: 3        # [EXP-610] scrub path only: a basketball flip needs a clock-stopped dead ball for +- this many s
    rewind_only: []      # leagues whose entries land on a dead ball with a rewind when one fits, never wait
    landing_lag_s: 0     # [landing lag] a fresh tune comes up up to this much later than the live edge (one-sided)
    cue: hidden              # [seek model, P1-REVIEW-03] hidden: the rewind runs on the HIDDEN stick before the flip; nothing
                             # ever rewinds on the visible screen, so with no hidden stick a rewinding entry waits
                             # pause: on the HIDDEN stick seek past the dead ball, play up to it, pause, flip, play
    possession_start: "off"  # [possession start] off | crunch | all: cue to the last dead ball before the possession, never wait while one is in reach
    confirmed_dead_only: false  # [data gap] a dead window opens only on a logged stoppage (a lone substitution means the stoppage is missing)
    unknown_wait_leagues: [nfl, nba, nhl, mlb]  # [EXP-089, D-01] never enter on a landing the data can't call ("play may be live"): rewind to a known dead ball or wait (league.base: cfb is nfl, cbb is nba)
    conformal:               # [EXP-024] conformal floor on entries: no landing on less doubt than tau x sigma (off until its gate passes)
      enabled: false
      tau: {nfl: 0, nba: 0, nhl: 0}   # per league, from conformal risk control on dev (alpha 0.005 a timed entry); 0 = no floor
    ended_strict: false  # [landing lag] a switch off a finished game never takes the urgent (thin-margin) landing
    crunch_now: wait         # [D-01] entries inside crunch's last 2:00 / OT: wait (rewind or wait for a whistle, like any entry) | live, rewind (only with allow_live_fallback)
    max_wait_s: {}         # [D-01] per league, only with allow_live_fallback: a whistle wait into a final period / off a finished game goes live after this (none: Rule #1 waits)
    hold_crunch_runup: true  # ...including into NHL crunch's 3:00-2:00 run-up (a whistle comes before 2:00)
    user_timed: true         # [EXP-741] one phone tap also waits until the joined game's picture would come up on a dead
                             # ball (Nick Nov 4 10:55 PM); the second "Go now" tap still cuts at once. Off: a tap only
                             # waits for a safe moment to leave the game on screen (Wed Nov 4 live: 15 taps landed mid-play)
    user_rewind_after_s: 15  # [EXP-741 B] with user_timed: after this many seconds a tap also takes a landing that needs
                             # a rewind to the last dead ball (YTTV), armed at the cut; null = never (no-rewind taps waited
                             # > 180 s on 12/20 NBA taps, lane 3). Graded arm: 15
    user_timed_targets: []   # [EXP-741 scope, N4] targets (app prefixes) a timed tap applies to; [] = all: one tap waits for a
                             # dead ball on every app (Prime too), a second tap forces. Lane 3: Prime waits p50 199 s
    no_data_wait_s: 45       # [P1-REVIEW-05] an entry into a game whose feed can't prove a dead ball waits this long, then the
                             # next game with a provable landing gets the pick (never in blind; alone, it waits and says so once)
    user_rewind_max_s: null  # [EXP-741 D] a tap never rewinds further than this (a longer one keeps waiting); null = no cap.
                             # Graded arm: 60 (arm B rewound one tap 123 s behind live)
    user_bug_gate: shadow    # [EXP-741 E] off | shadow | on: a tap onto Prime lands when the score bug's clock on the hidden
                             # stick has stopped (two equal reads >= 1.5 s apart, newest <= 5 s old), waits while it runs,
                             # and uses the feed plan only when unreadable; shadow only logs every Prime bug clock read to
                             # data/tap_bug.jsonl (taps never wait for it; gradable with user_timed off)
    start_timed: true        # [EXP-739, D-02] the night's first pick (and every restart: kind "start") waits for a whistle / rewinds like any entry (off: goes in
                             # live, which landed 6 NHL first picks 10-32 s after the opening faceoff, autopsy #302)
    lag_floor_s: 0           # [EXP-211] an open stoppage counts as dead only as far as a feed at least this slow would
                             # show the restart (0 = off; graded NHL value 71.3 = feed lag q90, EXP-303)
    break_tail: []           # [EXP-728/736] leagues whose entries into a break wait to land <= break_tail_s before the
                             # restart (redzone/decider/break_tail.py); [] = off until its gate passes
    break_tail_s: 10         # cutgrade's BREAK_TAIL_BAR: landing with more than this left is "mid-commercial"
    break_tail_q: q25        # the break-length quantile the restart is predicted with (low: errs early)
    break_tail_chain_s: 3    # dead windows this close together are one stretch (foul, free throws, timeout)
    break_tail_defer: false  # [EXP-803 A1] a tail due inside one decide tick: cut then (defer_s), not a tick later
    break_tail_tv_split: false   # [EXP-803 A3] NBA full timeouts use break_tail_tv_timeout_s, not the mixed row
    break_tail_tv_timeout_s: 170 # early side of an NBA full (TV) timeout: Data F's cdn q10, local 170.3 / national 176.7
  # Seconds to the new picture, MEASURED (the one source of truth; contracts/switching.ConfigSwitchPaths):
  # tunes = the Mac's LatencyBook medians (switch_speed.learn; pinned in eval-data-v1's eval_config.yaml);
  # hdmi_flip = the TV input change (two_stick.tv_flip_prior_s, SmartThings median 1.89 s) + the 1 s settle.
  # Replaced by your own measured times as you use it (see switch_speed).
  switch_cost: {youtubetv: 5.5, prime: 27, espn: 7.5, hdmi_flip: 3}
  return_tolerance: 5      # go back to the previous game if it's within this many points
  break_destination_min: 25   # anything at least this good beats watching a commercial
  chase_max_deficit: 15
  must_see_score: 92
  must_see_lead: 20
  locked_override_lead: 20
  manual_pause_s: 60
  lock_wait:               # a locked/held game we can't reach (no channel, tune failed): say why, retry, give up
    enabled: false         # off = old behavior (re-tries every tick, forever)
    retry_s: 20            # after a failed tune to the locked game, wait this long before the next try
    max_s: 90              # unreachable this long: drop the lock, tell you why, back to autopilot
  uncalibrated_sigma_s: 8  # above this delay uncertainty, only leave at official stoppages
  sticky_visit_needs_calibration: true  # your game's break: only visit games whose delay is calibrated (else no way back until their own break)
  wait_for_my_team_s: 1800  # your team tips within this: don't start on a basketball/hockey game we can't leave (uncalibrated)
  redzone_channel: true    # treat NFL RedZone as a candidate on Sunday afternoons
  redzone_score: 45        # RedZone vs a game (0-100): stay on it unless a game beats this; any break goes there
  # [EXP-204] your team "late and close" also needs the leader's win probability at or below this cap
  # (ESPN's WP when the feed has it, else a margin model). 1.0 = off (live: any Q4 that isn't garbage
  # time holds). Crunch time always holds. Nick, Nov 4: ATL up 12 with 9:09 left held WSH all night.
  mine_late_max_lead_wp: 1.0
  leave:                   # [cut rules, Nick Nov 4 3:15 PM] never JOIN mid-play; LEAVING mid-play only at low leverage
    dead_windows: []       # [whistle detection] also leave on the play-by-play's dead windows in these leagues
    high_leverage_recent_s: 30.0   # [F-01] [slate] a basketball walk-up leave waits this long after the game was last high leverage (Decider._may_leave_on_walk; the code's own fallback)
    tune_s: 6              # ...and the window must outlast this tune margin (a visit can't come back inside it)
                           # [Nov 7] these two sat in a second `leave:` block that YAML dropped: merged here
    low_leverage: []       # leagues where a low-leverage moment may be left mid-play ([] = never: today's rule)
    sticky_closeness: 0.5  # down the stretch is sticky: a late game at least this close is never left mid-play
    # [EXP-212] break floors on top of screen.MIN_BREAK_S, per league ({stoppage: s}; {} = off). With the
    # measured feed lag the data never covers the screen, so a basketball break with no restart in the data
    # can only be left while start + floor + delay hasn't passed. NBA end of a quarter, fit nights: min 148 s
    # (103 breaks, 7 nights; valid 34 breaks, min 148). Candidate {end_period: 120}, OFF until graded.
    break_floor_s: {}
    # [quiet break, Nick Nov 7 12:40] the data on the game you're watching went quiet right after a period
    # end / 0:00 clock / a score (stop-start sports): during the ad the feed logs nothing, and the stale-data
    # and uncalibrated-delay rules blocked leaving exactly then. Treat that entry as an official stoppage:
    # leavable from when it has surely aired until floor_s[kind] after it (same rule as a logged break with
    # no restart in the data). Ends the moment anything newer is logged. enabled: false = old behavior.
    quiet_break:
      enabled: true
      floor_s: {period_end: 120, score: 40}   # NFL END_PERIOD floor is 120 (p1 171 s); a PAT/kickoff follows a score
      near_end_clock_s: 0    # opt-in GUESS: last play left <= this many s before a quarter break and the
      near_end_quiet_s: 60   # feed is silent this long -> assume the clock ran out (0 = off)
  dwell:                   # [EXP-213, RC8 switch count] stay at least min_s on a game before an OPTIONAL switch
    min_s: 0               # 0 = off. Only these kinds wait; crunch, ended, home, return, start, user never do
    kinds: [break_visit, chase, better, drive, live]
    long_visit_min_score: 0   # a halftime / intermission visit only to a game at least this good (0 = any game)
  crunch:                  # final 2:00 of a one-score game, or OT: get there early, stay, hop only at gaps
    # [EXP-214] your team first: in its final period a catch-up return never leaves it, and late and close it is
    # never left for another game's crunch or a big-play chase (v3 NBA fit, 90 s buffer: your-team crunch live
    # 493 -> 535/537, resync 473 -> 521/537, 0 added mid-play entries). Overseer default ON (Nick can override).
    mine_first: true
    floor: true            # [SAFE-09] in a crunch window: no overlay or model leaves it for a non-crunch game, and
    floor_low_value: 0     # ...no game below this value (watch value, else score) pulls us out. 0 = off: at 50 it
                           # held dev but cost locked NFL crunch live -0.6/-3.9/0 (Nov 4); waits for watch value
    by_value: false        # [TREE-6 Mac half] crunch vs crunch by value (watch value, else score) with priors:
    value_league_prior: 5  # ...points per league-order step (NFL = CFB > NBA > NHL, MLB)
    value_mine_prior: 30   # ...points for your team / bet
    value_margin: 10       # ...jump only when the other crunch is worth this much more
    hold_personal: 5       # stay through every stoppage of a crunch game with this much personal boost (your team, bet)
    hold_neutral_breaks: [two_minute_warning]  # ...and of any crunch game through these (the 2:00 warning is the way in)
    personal_lead: 5       # your team / bet wins an overlap when its boost is this much bigger
    hop_min_break_s: 20    # hop to another live crunch only if this one's stoppage has this much left
    replays: true          # replays from other games during crunch stoppages, if surely back for the snap
    instant_replays: true  # ...including instant replays of plays you saw (false: only plays you missed)
    shortest_break_s:      # ~10th pct, stoppage -> next scrimmage play logged, late Q4/OT, 2025 games
      {timeout: 30, injury: 27, review: 80, score_break: 110, two_minute_warning: 150, end_period: 180}

jump_mode:                 # [Nick Nov 7 12:52, "should be 4-5 switches every minute"] a rotation over every live
                           # tunable game instead of "stay on the best game" (Decider._jump). At each dead ball on
                           # screen it flips to the game whose next snap is coming or that just had a big moment;
                           # the hidden stick keeps re-tuning to the next pick (Decider.jump_next). Rule #1 holds:
                           # strict dead ball to leave, dead-ball landing to arrive, both checked again at the flip.
  enabled: false           # OFF: Nick turns it on at runtime (POST /api/settings {"changes":{"jump_mode":{"enabled":true}}})
  leagues: [cfb, nfl]      # leagues the rotation runs in (a game on screen in another league uses the normal decider)
  min_plays: 1             # plays seen on screen before a jump to a "hot" game (snap coming / big moment)
  max_plays: 2             # after this many plays the game gives the screen up at its next dead ball
  max_hold_s: 90           # ...or after this long with no play seen (stale play data, a long stoppage)
  hold_rz_drive: true      # a scoring drive inside the 20 keeps the screen (crunch time always does)
  snap_window_s: 25        # "snap coming": its next snap airs within this long after the picture comes up
  snap_bonus: 15           # value points for a snap coming
  snap_gain_s: 10          # with no play seen yet, still jump when the other game's snap shows this much sooner
  big_recent_s: 60         # "just had a big moment": a big play aired (or about to air) within this long
  big_bonus: 20
  rotate_per_min: 6        # value points per minute since the rotation last left a game (fairness), capped at
  rotate_cap_s: 300
  standby_margin: 8        # the hidden stick keeps its game unless another one beats it by this much
  ready_only: true         # [overseer Nov 7 18:55] jump only onto the hidden stick's READY game; else wait for the
                           # standby to finish and jump at the next dead ball (two sticks only)
  go_when_ready: true      # [overseer Nov 7 20:05] the ready standby's game lands dead: jump at this dead ball
                           # once min_plays aired here, not after max_plays (0.2 jumps/min live was readiness)
  search_penalty: 20       # standby pick: value points off a local reached by search (~11-15 s vs ~3-4 s by code)
  margin_sigmas: 2         # delay doubt each side of a leave / landing, in sigmas (2 = every other entry's rule)
  flip_s: 3.2              # the input flip to the ready standby: a leave's dead window must outlast it
  land_dead_s: 2           # the target stays dead at least this long after its picture comes up
  allow_rewind: false      # first version: land live at the target's dead ball, never a DVR rewind
  replays: true            # a queued big-play catch-up takes the hidden stick (parked before its snap); the
                           # decider's replay switches go through jump mode untouched
  log: true                # every jump to data/jumps.jsonl (ids, numbers and short reason codes only)
  mine_prior: 30           # [D-04] rotation value points for a game you have a stake in (your team, your bet)
  league_prior: 4          # [D-04] rotation value points per league-order step (NFL first ... MLB last)
  join:                    # [Nick 2026-11-08 landing bars, jump + buffered modes, YouTube TV and Prime, with the delay margin]
    after_shot: [nba, cbb]  # basketball's only mid-possession landing: the walk up court right after a made shot / defensive rebound
    walk_s: 14             # the picture comes up within this long after the shot (the delay margin must fit inside it)
    transition_s: 7        # the next action this soon after the shot is a transition play: no landing there, the prior safe point instead
    after_play_s: 18       # football: prefer the picture up this long after the whistle (the replay), when the window still has room
    walk_after_s: 1        # the shot (or rebound) is stamped ~1 s before the ball is clear
    walk_guard_s: 2        # the next action's stamp can lead its start: the walk ends this far before it

buffered_jump:             # [overseer Nov 8 01:50Z / Nick 20:45 "play by play moment from moment"] jump mode with BOTH sticks
                           # scrubbed ~75 s behind live (yttv_seek overlay scrub, label read): the play-by-play already holds
                           # every snap and whistle about to air, so each cut is planned (redzone/decider/buffered.py). Needs
                           # jump_mode.enabled too. Sim: scripts/buffered_jump_sim.py. Stick test: scripts/buffered_jump_try.py
  enabled: false           # OFF: Nick turns it on at runtime (POST /api/settings {"changes":{"buffered_jump":{"enabled":true}}})
  leagues: [nfl, cfb, nba, cbb]   # [overseer Nov 8 22:15] + basketball (fouls, FTs, timeouts, violations are the
                           # dead balls; a made basket's inbound is too short for the delay margin). Others: jump mode's rules
  behind_s: 75             # scrub depth asked of each fresh YouTube TV tune (lands ~79 s: 16.8 k + 28.5, k=3)
  min_behind_s: 45         # a stick less behind than this (label) isn't a buffered picture: jump mode's own rules run
  hold_chunk_s: 25         # [overseer Nov 7] a Prime standby is pause-held in pauses this short (75 s in one came back 'stopped' 3/3)
  keep_standby_s: 120      # [overseer Nov 7] screen game gone/unknown: a 'start' to another game waits this long for the buffered standby's free cut
  restart_hold_s: 120      # [P-04] after a restart, the unknown screen counts as the saved game (for the leave rule) this long or until adopted
  flip_s: 3.2              # slowest input flip to the ready standby (live tonight 2.5-3.7 s)
  flip_fast_s: 2.0         # fastest
  roll_wait_s: 1.5         # a snap-parked standby must be seen rolling again within this long after its resume
  roll_poll_s: 0.15        # ...read this often
  margin_sigmas: 2         # delay doubt each side of a leave / landing (sim: 2 sigma at the 4 s floor = 0 mid-play)
  lead_min_s: 2            # the picture comes up at least this long before the target's snap
  lead_max_s: 8            # ...and at most this long past the delay margin (else wait for a later dead moment)
  long_dead_s: 45          # the screen game's next snap is further off (break, punt, score): leave for a sooner snap now
  park: true               # [Nick 21:05] the hidden stick PAUSES on the line-up just before its next logged snap (~flip +
                           # 2 sigma + 3.5 s ahead); every dead ball on screen (after min_plays) flips to it and PLAY rolls
                           # the snap; the freed stick keeps playing and parks at ITS next snap. Each pause adds to behind.
                           # Sim (37 NFL slates): 0.8 cuts/min, 1.35 plays/min shown (one game 0.79), 0 mid-play
  park_max_age_s: 45       # a park older than this is rolled on the hidden stick and parks again (long pauses lose place)
  park_schedule_s: 4       # the engine schedules the PAUSE when the park point is this close (the control times it)
  max_delay_s: 270         # screen delay (edge + behind, pauses included) past which the hidden stick re-tunes
  eager: false             # (park false only) true = cut at every shared dead ball (sim ~4.9 cuts/min, fewer plays shown) instead of snap-timed
  min_plays: 1             # plays the screen game shows before a snap-timed cut
  rotate_every_s: 600      # the hidden stick re-tunes (tune + scrub ~60 s) after the pair has been on this long...
  rotate_dead_s: 120       # ...or when its game's next snap is this far off (a break)
  prep_s: 60               # sim only: a re-tuned hidden stick is ready this long later

crunch:                    # [one brain, step 2] ONE crunch table (redzone/crunch.py), read by the scorer, standby,
                           # the demo and the grading. period / clock_s (left, at or under; null = whole period on) / margin /
                           # ot (crunch from this period on) / ot_close (OT still needs the margin). Values as shipped Nov 4.
  run_up:                  # crunch_time: up a little before the graded window, to arrive at a stoppage
    nfl: {period: 4, clock_s: 120, margin: 8, ot: 5}
    nba: {period: 4, clock_s: 180, margin: 7, ot: 5}
    nhl: {period: 3, clock_s: 180, margin: 1, ot: 4}
    mlb: {period: 8, clock_s: null, margin: 2, ot: 10}
  window:                  # crunch_window: the graded window the app aims at (NHL from 2:00)
    nfl: {period: 4, clock_s: 120, margin: 8, ot: 5}
    nba: {period: 4, clock_s: 180, margin: 7, ot: 5}
    nhl: {period: 3, clock_s: 120, margin: 1, ot: 4}
    mlb: {period: 8, clock_s: null, margin: 2, ot: 10}
  graded:                  # the lab scorecard's crunch plays (sportsgrade.is_crunch, demo crunch counts)
    nfl: {period: 4, clock_s: 120, margin: 8, ot: 5}
    nba: {period: 4, clock_s: 120, margin: 5, ot: 5}
    nhl: {period: 3, clock_s: 120, margin: 1, ot: 4}
    mlb: {period: 8, clock_s: null, margin: 2}
  soon:                    # standby.crunch_soon: crunch a few minutes off, pre-position the hidden stick
    nfl: {period: 4, clock_s: 420, margin: 8, ot: 5, ot_close: true}
    nba: {period: 4, clock_s: 360, margin: 8, ot: 5, ot_close: true}
    nhl: {period: 3, clock_s: 480, margin: 1, ot: 4, ot_close: true}
    mlb: {period: 8, clock_s: null, margin: 2}

core:                      # the decision core's expected-value knobs (redzone/decider/core.py); the
                           # auto-tuner searches these plus decider.switch_margin / break_destination_min /
                           # locked_override_lead / return_tolerance. Defaults = the rules the core replaced.
  points_per_switch_s: 1.0 # each second of black screen costs this many points of lead
  dead_air_penalty: 0.0    # points per second a commercial on screen costs
  break_value_frac: 1.0    # share of an on-break game's value that still counts
  break_risk: 0.0          # 0..1: discount a destination by the brain's chance it goes to break soon
  lock_in_step: 10.0       # friction added per reasoner lock_in level to leave a game
  reel_margin_s: 5.0       # the catch-up reel must fit its break with this much to spare
  league_priority: [nfl, cfb, nba, cbb, nhl, mlb]   # overlapping crunch times: first listed wins (after your team / bet)

fantasy:                   # ESPN fantasy football (leave league_id empty to turn off)
  league_id: ""
  team_id: 0               # 0 = figure it out from your ESPN_SWID cookie
  season: 2026


# [playbooks] Safety playbooks SAFE-01/02/03/05 (docs/playbooks.md, redzone/decider/playbooks.py): each holds a
# switch and logs "playbook=<id>". OFF until the night lab and the North Star sets clear them.
playbooks:
  safe:
    enabled: false
    feed_stale_s: 10      # SAFE-01: target feed this far past its poll cadence = stale
    sigma_s: 10           # SAFE-02: delay doubt above this = full-margin landings only (dev sweep: 3-8 s holds normal entries)
    net_q: 9              # SAFE-03: sync probe network condition (>= 2 buffering/min or an RSSI drop)
    net_window_s: 300
    skew_s: 5             # SAFE-05: wall vs monotonic jump that counts as clock skew
    reanchor_s: 90
  game:                   # [scenario tree] GAME-01..03, 21, 22 branches (redzone/decider/scenarios.py), OFF
    enabled: false
    table: ""             # a JSON branch table (the cloud-built tree); empty = the hand-written seeds
    skip: [GAME-01]       # rows left out: GAME-01 visits cost NFL dev crunch 70.7 -> 69.3, big live 54.4 -> 53.5
    crunch_overlap: false # GAME-05: two same-tier crunches: higher stakes (OT, 2:00 window, score) stays live
    empty_net: false      # GAME-09: an NHL pulled goalie counts as crunch time (live feed only: not in replays)
screen:
  mic_calibration: false   # let the Mac's mic hear crowd roars to measure your delay (nothing is recorded)

providers:
  profiles:               # Exact names; an unreadable picker requires manual selection.
