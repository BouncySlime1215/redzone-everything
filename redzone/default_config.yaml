autonomy:
  st_scan_early: false     # [build plan WP-06] Sunday Ticket scan starts at T-75, resumes after a stop, done by T-20
  app_version_alerts: false # [build plan WP-06] a toast when a stick app version changes
  enabled: true
  discover_devices: false # first select your own TV/sticks with scripts/doctor.py
  busy_score: 75          # postpone maintenance during an important game
  selftest_may_wake: false
  test_targets: {youtubetv: "", prime: "", espn: ""}

supervisor:                # watches the live system and fixes what it can on its own (redzone/supervisor.py)
  enabled: true
  ntfy_topic: ""           # optional: push the nightly report to the free ntfy app (pick a hard-to-guess topic)
  ntfy_server: "https://ntfy.sh"   # [F-01] the ntfy server the push goes to (supervisor.DEFAULTS["ntfy_server"], the same value)
  budget:                  # error budget, over the last window_nights nights that had switches (nightly report)
    window_nights: 7
    failure_pct: 5         # failed + picture-never-confirmed switches, % of live switches
    mid_play_cuts: 0       # cuts that left a play on screen (judged from the feed ~90 s later)
    dead_air_s: 10         # a cut whose new picture took longer than this is "slow"...
    dead_air_pct: 10       # ...and this % of cuts may be slow
    safe_mode_min: 10      # minutes in safe mode a night
  mac_health:              # [Nick Nov 7 item 6] phone alerts when the Mac itself is the problem (redzone/platform/mac_health.py)
    enabled: false         # OFF until Nick turns it on; sees and says only, never changes the Mac
    battery_low_pct: 20    # on battery at or under this -> high (pushed); battery_critical_pct -> urgent
    battery_critical_pct: 10
    battery_hold_s: 120    # on battery with live games this long -> warn
    sleep_gap_s: 60        # asleep or frozen this long between ticks -> high with live games
    keep_awake_s: 120      # live games but caffeinate not running this long -> warn
    mem_hold_s: 60         # memory pressure critical this long -> alert
    swap_alert_mb: 8000    # swap this high with live games for swap_hold_s -> warn (Nov 3-7: 5.8-10 GB seen)
    swap_hold_s: 300
    paused_alert_s: 600    # auto-switching paused this long with live games -> warn
    no_switch_s: 1200      # no switch row this long with no_switch_min_live+ live games on autopilot -> high
    no_switch_min_live: 2
    repeat_s: 1800         # an alert still true says so again this often
    push: true             # high/urgent also go through ntfy when ntfy_topic is set
  night_ops:               # [Nick Nov 7 item 7] joins, errors, fallbacks, drift, Mac alerts in the nightly report
    enabled: false
    join_margin_s: 10      # a join landing within this of its target counts as on target

multiview:                 # YouTube TV multiview as a switch path (redzone/tuners/multiview.py)
  enabled: false           # off until scripts/multiview_probe.py has measured it on the real sticks
  tiles: 4                 # games in one multiview (YouTube TV's 2x2)
  must_have: 2             # reopen only when one of the top this-many YTTV games isn't a tile
  costs: {mv_open: 15.0, mv_expand: 1.5, mv_collapse: 1.0, mv_step: 0.35}   # seconds, until measured
tuners:                    # per-app switch paths
  prime_fast_confirm: false # [build plan WP-04] confirm a Prime tune without running OCR inside the poll loops
  espn_link_form: false     # [build plan WP-04] use the checked ESPN deep-link form
  app_change_confirm: false # [TV Nov 10] after another app was in front: let the plain link confirm (about 2.5 s) before the
                            # resend as a new task, and count the asked channel already playing at a retry as success
  unauthorized_retry_s: 300   # [DEV-15] an adb-unauthorized stick is not re-connected faster than this (re-raises the TV prompt)
  diagnose_timeout_s: 4       # [DEV-17] a failed tune's screen read (names "signed out" etc.) is cut after this
  launch_timeout_s: 30     # [DEV-11] `am start -W` (an app deep link) waits this long: a cold start can top 15 s
  prime_multiview: false   # Prime NBA multiview (redzone/tuners/prime_multiview.py): a switch between its
                           # tiles is ~1 s of remote navigation, no relaunch. Off until a live Prime NBA
                           # night passes the gate (>= 95% right tile under 2 s, 0 mid-play entries)
  prime_tiles: 3           # games in one Prime multiview (1 main + 2 on the right)
  prime_tile_s: 1.0        # seconds for a tile switch, until data/prime_multiview_keys.json has timings
  prime_tile_p90_s: 2.0    # ...and its deadline bound
  relink_gap_s: 0          # [Nick Nov 7 11:50: two tunes back to back failed 1/10 "video never started", slow 2/10;
                           # a 3 s gap fixed the delay probe, #408] wait this long between the reset tune and the tune
                           # back (control's reset through another channel, the watchdog relink, the canary). 0 = off
  yttv_local_search: false # ABC/CBS/FOX/NBC locals by YouTube TV search (WRAL, ABC 11, CBS 17, FOX 50): channel
                           # page -> Select, accepted only on a media-session subtitle naming the station AND a
                           # live playhead. fox/cbs Sunday Ticket mirror codes are skipped except on Sundays (Nov 7)
  yttv_local_search_live: false # true: the engine re-reads yttv_local_search every decide tick, so a change
                           # through POST /api/settings (or Undo) applies within ~0.5 s, no restart. false: read
                           # once at startup, as before. A tune in progress keeps the ref it started with (Nov 7)
autofix:                   # the watchdog files problems it can't fix as GitHub issues for Claude (docs/auto-fix.md)
  enabled: true            # kill switch on the Mac side (the repo variable AUTOFIX_ENABLED=false stops the GitHub side)
  max_per_day: 3           # at most this many issues a day
  refile_days: 7           # the same error is filed at most once per this many days
  repo: ""                 # owner/name; empty = this checkout's origin
governor:                  # keeps the Mac cool and its disk free (redzone/governor.py); live switching is never slowed
  enabled: true
  every_s: 30              # look at the Mac this often
  calm_s: 180              # a busy/hot/battery state must clear this long before work resumes
  footprint_log: true      # [F-01] log the Mac's footprint to data/footprint.jsonl (Governor.from_config; the code's own fallback)
  busy_load: 0.85          # 5-min load per CPU core above this: the Mac is busy (eco)
  battery_eco: true        # on battery: eco (no reel downloads/lab/archive, slower idle polling; OCR keeps its full rate)
  battery_low_pct: 20      # on battery under this: critical (also no OCR, no local model)
  swap_growth_mb: 300      # swap grew more than this in swap_window_s while memory pressure >= warn: eco (a swap SIZE is not a signal, P-07)
  swap_window_s: 600
  swap_critical_pct: 90    # swap this % of its total: critical
  disk_low_mb: 3000        # free disk under this: eco (no new downloads)
  disk_critical_mb: 1500   # free disk under this: critical
  service_soft_mb: 700     # the app's memory: shown as a warning above this
  service_hard_mb: 1200    # ...the watchdog restarts the app above this (never during crunch time)
  models_mb: 1500          # all local model processes together (watchdog + game reasoner)

personal:                  # Nick's own phone metadata, local only (decisions 2026-11-09; docs/memory/runbooks/personal-intake.md)
  enabled: false           # off: POST /api/personal/app-open is 404 and nothing is written. The show does not read it yet

hardening:                 # error handling (PLATFORM). Each switch is off until a live night proves it.
  smartthings: false       # SmartThings breaker, 429 Retry-After, auth fault + phone push (redzone/tv.py)
  sticks: false            # a player "buffering" 20 s+ is stalled: resume the visible stick, reload the standby
  feeds: false             # a live game whose ESPN polling went dark takes FastCast pushes until polling is back
  mac: false               # after the Mac sleeps or changes network: re-check network, reconnect sticks, resync the TV
  watchdog: false          # the watchdog may ask the app for narrow fixes (POST /api/agent/fix); off: it only tells you
  tv: false                # the TV jumped by itself to a stick on its home screen (a reboot's HDMI-CEC): flip it back

sound_guard:               # [Nick, Nov 10: "Volume must be 1000% off"] the TV's mute and volume by readback (redzone/platform/sound_guard.py)
  enabled: false           # on: read mute + volume back before the first input switch, after every switch and every check_s;
                           # off: no guard exists and no sound call is made (read once at app start)
  must_be_silent: false    # on: muted AND volume 0 is required (not silent, or unreadable unreadable_max times = incident),
                           # and redzone/tv.py refuses KEY_VOLUP, KEY_MUTE, volumeUp, unmute, setVolume above 0 and volume_duck
  check_s: 20.0            # the periodic check (tvctl.py watch used 20 s)
  unreadable_max: 3        # this many readbacks in a row without mute or volume is an incident ("no readback, no test")
  silence_tries: 4         # volume 0 + mute + read back, this many tries, before the first switch of a session
  on_incident: off_tv      # off_tv: power the TV off, then block switching until cleared by hand; block: only block
  settle_s: 0.7            # after volume 0 + mute, wait this long before the readback (tvctl.py); read once at import

two_stick:
  unavailable_backoff_s: 0  # [Nick live test Nov 7] a standby tune that stopped at an account/payment/UNAVAILABLE screen keeps
                            # that game off the standby this long (0 = the usual 120 s retry). Suggested 900
  standby_repause_s: 600     # [APP-04] the same standby pausing again within this long is a blocked app (a forced update)
  smartthings_cloud: true  # [Nick, 2026-11-10: "use smart things"] back ON: on Nov 9 it was the only flip that worked on his TV
                           # (9 of 9; local key 0 of 3). Free access ends 2026-12-15 and the $0 rule forbids a paid plan, so a
                           # second flip path is needed by then. false = "disabled by policy": no cloud call, probe or alert
  tv_verify_deadline_s: 2.5     # [DEV-03] a TV input readback never holds a flip longer than this
  tv_local_lock_wait_s: 3.0     # [DEV-16] a key waits this long for the shared TV socket (a keepalive or key using it)
  tv_maintain_timeout_s: 20.0   # [DEV-10] one keepalive's TV upkeep is cut after this
  identity_check: true     # [DEV-09] each stick, once per connection, against devices.json (reads only)
  max_safe_wait_s: 12.0    # [P1-ROOTCAUSE-04] a planned cut gives up after this and re-plans: useful waits peaked at 10.7 s, 0 of 23 full 25 s waits cut
  tap_safe_wait_s: 25.0    # a phone tap keeps the longer wait for its dead ball [N4]
  cec_flip: true           # HOME -> HDMI-CEC Active Source as the last-resort flip (the TV's own input change,
                           # set up by scripts/tv_setup.py, goes first when it's proven)
  enabled: true            # with two Fire OS sticks: tune the hidden one, flip the TV input at a safe moment
  break_p: 0.5             # [F-01] a break forecast at or above this probability lets the hidden stick pre-spend the break (engine._break_standby; the code's own fallback)
  hold_s: 20               # keep the hidden stick on a game at least this long before re-tuning it...
  min_gain: 8              # ...and then only for one this many points better (your game's return and
                           # a replay about to play take it right away)
  verify_s: 15             # check the hidden stick is still playing this often
  hand_back_s: 600         # for this long after you pick a game on the phone, the game you left keeps the
                           # hidden stick (ranked with your game's return), so a tap back is a ~2 s flip.
                           # 0 = off. Nov 4: 11 of 16 phone presses to Prime were cold (~30 s), ~2 min apart.
  pretune_on_open: true    # opening a live game on the phone pre-tunes it on the hidden stick (90 s), so
                           # "Watch this" / "Go now" is a ~3 s flip instead of a ~8 s tune + flip
  input_settle_s: 1.0      # your TV's picture takes this long after an input flip (time it once)
  tv_flip_prior_s: {median: 1.89, p95: 1.98, max: 2.02}  # the TV's own input change (SmartThings) before
                           # we've timed 5: the live lab on your TV, Nov 4, CEC off (30/30; with CEC on it was
                           # p95 2.18, max 2.58). The decider plans flips with the median, bounds them with the max.
  keep_cec_off: true       # a stick whose HDMI-CEC you turned off (scripts/stick_cec.py) gets it back on only
                           # for a HOME fallback onto it, then off again (so losing the input never pauses it)
  park_max_s: 240          # a replay waiting on the hidden stick is re-cued after this long
  shadow:                  # the hidden stick as modeled in replays/backtests (standby.ShadowStick); values unchanged
    flip_s: 3.0            # input flip to a ready stick (measured median ~2.9 s); moving to tv_flip_prior_s +
                           # input_settle_s changes behavior, so it's a separate decision
    tune_s: 7.0            # a tune, for an app with no decider.switch_cost entry
    keep_s: 2.5            # a Prime game we left keeps playing: ready again after this long

demo:                      # replay simulator timing (redzone/demo/engine.py); values unchanged
  feed_lag_s: 8.0          # a play reaches the app this long after it happens (same as the backtest)
  play_len_s: 7.0          # a play's length on screen, for grading
  tune_s: 5.0              # the replay's picture is up this long after a switch
  calibrated_sigma_s: 3.0  # delay uncertainty of a calibrated game

plan:                      # tonight's plan (data/plan_YYYYMMDD.json, the phone's "Tonight's plan" card)
  sweep: false             # [build plan WP-01] start the hidden-stick route check earlier and cover every planned route
  sweep_lead_min: 30       # [build plan WP-01] ...starting this long before the first window
  verify: true             # before each start window, play each planned source on the HIDDEN stick (never the one on screen)
  verify_lead_min: 20      # ...starting this many minutes before the window, while autopilot is idle

switch_speed:              # every real tune and input flip is timed; the decider plans with the medians
  learn: true              # keep decider.switch_cost up to date from those measurements
  sync_every_s: 300        # at most this often (sooner when two-stick mode turns on or off)

redzone_mode:              # whip-around like NFL RedZone (scoring/drive.py; decider _drive_takeover, _nfl_priority)
  enabled: true
  hot_heat: 0.5            # drive heat (0-1, scoring/drive.py) that counts as "a drive is alive": ~a moving drive past midfield
  takeover_heat: 0.65      # ...a drive this hot is worth leaving the whip-around for (see drive_over_redzone)
  drive_over_redzone: true # on the RedZone channel and a game we can tune has a live drive: watch that drive ourselves
  takeover_break_p: 0.5    # ...and only when its break forecast (scoring/breaks.py) is under this: no tuning into a commercial
  drive_in_20: false       # a tunable NFL drive inside the 20 elsewhere: go there at the next dead ball (and before
                           # more catch-up replays). OFF: valid split +2.8 pts NFL big plays live, -1.3 within 10 min
  drive_in_20_from_redzone: true   # ...also from the RedZone channel (that's where most of the gain was)
  drive_in_20_after_replay: false  # ...and cut a catch-up chain short for one (on: -4 pts within 10 min)
  min_redzone_s: 20        # ...but only after this long on the channel: no bouncing on every poll
  redzone_lift: 8          # RedZone gains up to this many points with the hottest drive (it's showing it), vs ordinary games
  nfl_priority: true       # while an NFL drive is live, other sports' non-crunch moments rank below it (your teams,
                           # crunch, your focus game, and leagues you rank above the NFL in score.league_weight exempt)
  priority_gap: 15         # ...those other games are held this many points under the hottest drive
  heat_points: 0           # NFL game score lift per unit of heat. 8 cost big plays and your-team plays on the NFL scorecard
  dead_damp: 0             # share of score lost to punt-fest signs. 0.25 cost big plays on the NFL scorecard

session_guard:             # [sync hardening item 4, Nick Nov 7] redzone/tuners/session_guard.py: classify each stick
                           # session (banner, profile, still-watching, auto-play, crash, reboot, adb drop, Prime detail
                           # page, label reset, unexpected UI text) and fail closed. Runbook: runbooks/stick-session.md
  enabled: false           # observe + log + demote buffer trust; the scrub waits out the post-tune banner and checks
                           # the session (adb only) before its first key
  act: false               # also run recoveries (re-link, clear prompts, 'Ask later' only); keys only on the hidden
                           # stick except the prompts already covering the picture
  banner_s: 28             # Nov 6: the LIVE/title banner sat up 20-25+ s after a tune and looks like the overlay
  banner_wait_max_s: 30
  reboot_slack_s: 30       # /proc/uptime falling by more than this between looks = rebooted
  label_slack_s: 20        # a label this far under where the playhead should be = program boundary (label reset)
  label_ahead_s: 45
  max_actions: 3           # recoveries per stick per window, then hold + alert (no key storms)
  action_window_s: 600

yttv_seek:                 # [YTTV scrub buffer, item 1] enter the time-shift buffer on the HIDDEN YouTube TV stick by
                           # scrubbing the player overlay (CENTER, LEFT x N, CENTER; overseer Nov 6: 7/7 held, pause
                           # doesn't). OFF until the switch path (item 4) and a hidden-stick night prove it.
  enabled: false
  skip_open_read: false    # [build plan WP-03] drop the first overlay read when a RIGHT probe follows; the knob read stays
  overlay_band_from: null  # [build plan WP-03] screen fraction where the overlay band capture starts; null = full frame
  step_s: 15               # one LEFT on the focused bar moves the knob this far back (measured Nov 6)
  max_back_s: 150          # never scrub further (ACC Network stopped near 2.5 min behind)
  step_tol_s: 6            # the knob label must move N x step_s within this, or no commit (4 -> 6: 47/48 live, 1 fail at 40 vs 45)
  boundary_retries: 1      # a failed knob check (the label resets at a new program) retries once from the live
                           # edge, only after a re-link to live with nothing committed; then fail closed
  key_gap_s: 0.35          # between LEFT presses
  settle_s: 4              # after the commit the player must report PLAYING within this (its state only)
  poll_s: 0.25             # how often the player is read while it settles
  overlay_wait_s: 1.3      # after CENTER or a LEFT, wait this long before reading the overlay (live Nov 6: 0.8 too short)
  program_start_guard: true  # the bar starts at the program start (FOX 50 just after kickoff: label 5 s): if the LEFTs
                           # need more than the label, fail closed before pressing them (Nick, Nov 7 noon)
  open_tries: 4            # probe LEFT, no scrub label = close, reopen, retry; fail closed after this many (tune banner)
  reopen_wait_s: 1.5       # between closing and reopening the overlay
  probe_key: RIGHT         # the probe at the live edge: RIGHT lands on the bar without moving the pinned knob (8/8),
                           # LEFT only reveals the label there too (6/6, same landings; Nick, Nov 7). RIGHT is the default
  topup_max: 1             # a knob one whole step short before the commit (a lost press) gets this many more LEFTs
  topup_tol_s: 2           # ...only when it is one step short within this, and that LEFT then moves one step within this
  reset_channel: ""        # a stick that may be behind on a channel goes through this one to get back to live (a
                           # same-channel deep link does not reset it; Nick, Nov 7). "" = any other coded channel

fallback_ladder:           # [Nick's Nov 7 sync order, item 2] when a join can't be made as planned, climb down per stick:
                           # buffered (measured) -> live edge (same stick, known position) -> other stick (tunes in place
                           # at a dead ball) -> hold the current game. Each step in data/ladder.jsonl and on the phone.
                           # Every flip still waits for a safe moment (Rule #1). OFF until a hidden-stick night.
  enabled: false
  other_stick_apps: [youtubetv]   # apps the visible stick may tune in place as a fallback (a Prime tune is ~32 s on screen)
  skip_after: 2            # a rung that failed this many times on one stick inside window_s...
  window_s: 600
  cooldown_s: 300          # ...is skipped on that stick this long (no key storms on a path broken tonight)
  skip_rungs: [live, other_stick]   # DEFAULT: a failed buffer entry HOLDS (Rule #1). Both rungs enter at the live
                           # edge; the report-only replay with the 25 s dead-ball re-check still adds NFL mid-play
                           # entries (10%: 59.3 -> 61.0, 25%: 66.0 -> 68.7 per run; scripts/ladder_replay.py). [] = all
  budget_s: 90             # rungs that would start after this many seconds of climbing are skipped (-> hold)

prime_pause:               # [Prime buffer] enter the time-shift buffer on a HIDDEN Prime Video stick by pausing it
                           # (overseer Nov 7: 60 s pause = +61 s on Prime's timecode, held 4 min, no snap; YouTube TV
                           # pause does not hold, so it scrubs: yttv_seek). Never MEDIA_REWIND (continuous on Prime).
  enabled: false
  max_hold_s: 120          # never hold longer in one go
  overlay_wait_s: 1.5      # after PAUSE (and between timecode read retries), before reading the overlay
  read_tries: 2            # timecode reads after the pause before failing closed
  poll_s: 0.5              # hidden check during the hold, and the player state after PLAY
  settle_s: 4              # after PLAY the player must report PLAYING within this (state only)
  hold_tol_s: 2            # the paused timecode may drift this much during the hold, else it moved: fail closed
  gain_tol_s: 3            # the timecode gain must match the held wall time within this, else fail closed
  band_y_min: 0.55         # the timecode is read only below this fraction of the screen height (not the scorebug)

join:                      # [Join API] put a HIDDEN stick a chosen time behind live, predict, measure, log the error
                           # (redzone/tuners/join.py; overseer's 9 label-measured runs, Nov 7). OFF: the caller checks it.
  enabled: false
  yttv_step_s: 15          # one LEFT moves the knob 15 s (the knob checks; never hold the overlay in between)
  yttv_left_s: 16.8        # ... but the landing grows 16.8 s per real LEFT k (each adds ~1.4-1.8 s of frozen overlay;
                           # Nick's depth sweep Nov 7, k = 1, 2, 4, 6 within 1 s). k = round((T - before - 28.5) / 16.8), >= 1
  yttv_lead_s: 21.0        # predicted landing = before + 16.8 k + this + yttv_read_s (21.0 + 7.5 = the sweep's 28.5)
  yttv_err_s: 3            # expected +- error of a YouTube TV join
  prime_bias_s: 0          # predicted landing = before + hold + this (Prime pause, ~1-2 s accurate)
  prime_err_s: 2           # expected +- error of a Prime join
  max_s: 150               # never join further behind live
  yttv_read_s: 7.5         # the label read that measures a join freezes ~7.5 s and its reading includes that: predicted
                           # = before + 16.8 k + lead + this (Nick Nov 7: measured - predicted +5.9, +6.5, +6.5, +7.8 without it)
  watchdog:                # [join watchdog, Nick Nov 7 item 1] verify every entry on the label / timecode (join_watchdog.py)
    enabled: false         # OFF: control's scrub entry and watched_join check it
    margin_s: {youtubetv: 6, prime: 4}            # |read - predicted| allowed (9 label runs: -4.4..+4.9; Prime +-1-2)
    target_band_s: {youtubetv: 10.5, prime: 5}    # |read - target| allowed when there is no plan (control, re-probe)
    target_gross_s: {youtubetv: 20, prime: 8}     # with a plan: |read - target| only for gross misses (16.8 s steps)
    min_behind_s: 5        # a reading at or below this is the live edge, not a buffer
    over_s: 15             # a reading past max_s + this is a runaway / misread
    max_reseeks: 1         # then fall back
    reprobe_unmeasured: false  # an unmeasured committed join: read the label once more before falling back (+~7.5 s)
    fallback: live         # live = relink to the live edge through another channel; keep = leave it, state unknown
  drift:                   # [drift monitor, Nick Nov 7 item 3] rare, budgeted re-reads of the HIDDEN stick only
    enabled: false
    first_s: 300           # first check 5 min after a verified join, then x backoff while it holds
    backoff: 3             # [Nick 14:11Z: it holds, read rarely] 5 min, 15 min, then every 20 min
    max_interval_s: 1200   # scrub_trust_s: the longest hold proven (20 min)
    budget_s_per_h: 45     # wall seconds of reads per stick per rolling hour (~4 YouTube TV reads at ~10.5 s)
    drift_margin_s: 3      # |read - expected| above this re-enters; the depth each read adds is planned (in expected)
    read_cost_s: {youtubetv: 10.5, prime: 8}      # wall time of one read (Nick Nov 7: 9.8, 10.4, 10.1 s)
    read_adds_s: {youtubetv: 8.5, prime: 0}       # the frozen overlay pushes YouTube TV back by this per read
  calib:                   # [item 5, Nov 7] self-calibration per channel and stick (redzone/tuners/join_calib.py). OFF
    enabled: false         # on: each plan uses the calibrated lead (YouTube TV) / bias (Prime) from data/joins.jsonl
    window: 20             # newest measured joins per key (app -> app:channel -> app:channel:stick)
    max_age_days: 21       # older joins ignored
    prior_n: 4             # pseudo-joins of the parent's value (one join moves a new channel 1/5 of the way)
    gross_s: 12            # |measured - predicted| above this: counted and reported, never used
    clip_k: 2              # each residual clipped to parent +- 2 x expected error
    shift_n: 3             # newest 3 joins all off the same side by > shift_s -> SHIFT alert (canary + night report)
    shift_s: 5
    max_shift_s: {youtubetv: 5, prime: 3}   # calibrated value stays within shipped +- this (21.0 +- 5, 0 +- 3)
    err_min_s: 1
    err_max_s: 6
    edge_prior_s: 25.9     # D_edge of an on-time YouTube TV channel (Nov 7), stats only
    edge_min_s: 15
    edge_max_s: 45
    use_canary: true       # the daily canary's joins count (real joins on the hidden stick)

canary:                    # [item 8, Nov 7] daily pre-game self-test on the HIDDEN stick (scripts/canary.py). Manual /
                           # launchd (deploy/com.redzone.canary.plist.template, not installed); fails loud to the phone
  soon_s: 5400             # refuse when any game is live or starts within 90 min
  channel: espn            # YouTube TV channel tuned for the test (any channel with a watch code works)
  away_channel: fs1        # tuned first so the canary channel's tune is fresh at the live edge (#391: same-channel
                           # deep link does not reset a stick that is behind live)
  target_s: 60             # the join it asks for: 3 LEFTs, predicted 56.7 s
  tol_s: 6                 # |measured - predicted| must be within this (2 x the YouTube TV +-3 s)
  settle_s: 8              # after the tune, before the join
  prime: false             # also test a Prime pause (needs a playing Prime title: off pre-game)

replay:                    # catch-up replays of big plays you missed (YouTube TV can rewind live TV)
  enabled: true
  pause_poll_s: 0.4        # [F-01] how often a buffered jump re-reads the hidden stick's player while its PAUSE settles (control.py; the code's own fallback)
  yttv_seek: scrub         # [Nick, Nov 7] a YouTube TV catch-up is seeked on the HIDDEN stick by the overlay scrub
                           # (yttv_seek.enter_buffer, knob-checked), its landing READ on the label (LabelProbe), then
                           # it plays up to park_lead_s before the snap and pauses there; the flip un-pauses it. The
                           # viewer never sees a rewind. "keys" = the old seek_key presses (their 20 s shell timeout
                           # failed every YouTube TV replay: 'replay seek failed', 20-24 s each)
  back_lead_s: 3           # a replay's back_s already starts this long before the snap (Missed.back_s)
  park_lead_s: 1.5         # ...the scrubbed stick is paused this long before the snap (Nick: land 1-2 s before it)
  scrub_slack_s: 4         # playing (not frozen) time in a scrub: one more LEFT's worth of room is planned for it
  park_wait_max_s: 40      # a scrub landing more than this before the park point fails closed (holds the stick)
  park_max_age_s: 90       # a YouTube TV park older than this is never rolled (a 120 s pause reset the position, Nov 6)
  pause_settle_s: 3        # after the park's PAUSE, re-read the player this long for 'paused' (a first 'none' is transient)
  scrub_retry_s: 120       # a failed replay scrub on a channel isn't tried again for this long (no key storms)
  fail_retry_s: 120        # a failed replay (any path) of a play isn't decided again for this long (Nov 8 live: 2 Hz loop)
  max_fails: 2             # after this many failed replays a play leaves the catch-up queue
  scrub_max_play_age_s: 95   # YouTube TV scrub replays: an older play can't be parked (8 LEFTs ~117 s back, after the tune + banner wait): not queued
  park_after_tune_s: 22      # a freshly tuned stick waits out YouTube TV's post-tune banner before the replay scrub (keys do nothing there)
  yttv_max_lefts: 8        # never more LEFTs than this (8 = 120 s of knob): a deeper catch-up is not seeked
  yours_first: true        # your team's missed big plays: replayed before other games' and over ordinary live play
  apps: [youtubetv]        # apps where rewinding live TV works
  max_age_s: 1800          # don't replay anything older than this
  crunch_block: false      # [crunch block] no catch-up starts while any live game is in crunch time / its run-up
  crunch_block_mine_leagues: []   # ...your team's missed play still goes in these leagues (its game's league)
  crunch_block_mine_after_s: 90    # ...once this long after it aired
  crunch_block_tail: false # ...and until a game the feed ended in crunch (an OT winner) has finished airing
  when_alone: false        # a catch-up is still checked when no other game is worth switching to
  urgent_s: 1200           # in its last N seconds a missed play jumps the queue and beats dull live play
  clip_s: 15               # how long each replay plays
  seek_s: 6                # time spent rewinding to the play
  instant_window_s: 900    # when everything's on a break, re-show great plays from the last 15 min
  seek_key: KEYCODE_MEDIA_REWIND
  seek_step_s: 15          # seconds per rewind press: YouTube TV steps 15 s (live lab, Nov 4; was 10)
  seek_wake_presses: 1  # the first press of each batch does nothing (live lab, Nov 4): one extra is sent
  seek_stall_min_s: 2      # each seek stalls the picture 2-4 s (live lab, Nov 4), which lands it that much
  seek_stall_max_s: 4      # further behind
  seek_press_s: 0.25       # [seek model] the stick takes seek presses at about this pace
  pause_keys_s: 0.5        # ...then the pause / play keys
  pause_err_s: 0.25        # a pause cue's landing error, calibrated (the lab's pause hold: well under 0.5 s)
  pause_cue_grain_s: 0.5   # a pause cue's landing grain (the lab's pause hold: +1.66 s raw, under 0.5 s calibrated)
  hidden_seek_keys_s: 1.5  # a hidden-stick seek's presses + PLAY before the flip (the stall comes on top)
  redzone_way: false       # catch-up the RedZone way (Nick, Nov 4; OFF until its gate passes): lull, "meanwhile",
                           # collision and end-of-night montage triggers (redzone/decider/decider.py)
  catchup_s: 600           # each missed big play replayed within this; its value halves every catchup_s
  collision_s: 180         # missed because another big play was on screen: replayed within this
  window_s: 0              # [replay window] Nick, Nov 4: a missed moment airs within this (180 = 3 min, the next
                           # dead moment) or is skipped / folded into the montage; 0 = off
  window_leagues: []       # ...only these leagues' plays ([] = every league)
  window_fill: false       # ...past the window a play may still fill dead time (never displacing live play)
  resume: false            # [replay and resume] a missed play airs at the screen game's dead ball: pause it, show
                           # the catch-up, resume on the same frame (costs buffer, not live play); repaid by
                           # skipping ahead in its next break. Hardware gate: pause/resume on the same frame.
  resume_leagues: []       # only these leagues' screen games pause ([] = every league)
  resume_window_s: 180     # only plays that aired within this long (Nick: 3 minutes)
  resume_cap_s: 60         # never run more than this far behind the usual buffer
  resume_crunch_share: 0.0 # in crunch time only this share of the cap (0 = never pause crunch time)
  resume_min_skip_s: 10    # skip ahead in a break only if it wins back at least this much
  resume_pause_s: 1.0      # the pause command's ack: a stoppage on screen this much longer is enough to pause
  lull_score: 45           # no live game at this score or above (and no crunch / lock): a replay takes the dead ball
  meanwhile_s: 120         # the screen's game just scored: plays elsewhere within this of it go first
  montage_age_s: 14400     # nothing live: every missed big play still on the DVR, however old

reel:                      # catch-up reel: 5+ plays you missed, back to back, 30-60 s (redzone/reel.py)
  enabled: true            # find, download and trim clips as they post (ESPN's in-game highlights)
  play: false              # put reels on the TV (off until the Fire TV player is checked on the stick)
  score: 40                # how the reel ranks as a break destination (live games >= break_destination_min win)
  min_clips: 5
  min_s: 30
  max_s: 60
  max_age_s: 1800          # plays older than this don't make a reel
  parallel: 2              # clips prepared at once (download + trim, ~3 s CPU each)
  cache_mb: 400            # trimmed clips kept on disk
  min_free_mb: 1500        # never download with less free disk than this

timing:
  behind_live_s:           # [time-shift buffer] hold each stream B s behind live so the feeds lead the screen
    enabled: false         # OFF until Nick's live test (docs/live-test-wed.md); sim at B=90: NHL entries
                           # mid-play 12 -> 0, NBA big seen 67.8 -> 87.4 %, NFL big seen 77.9 -> 97 % (docs/timing.md)
    by_league: {nfl: 60, cfb: 60, nba: 90, cbb: 90, wcbb: 90, nhl: 90}
    default: 60
    max_s: 90              # Nick's cap (~1 min behind live accepted, 90 s at most)
    shadow_stay_leave_every_s: 15.0   # [F-01] the buffer shadow logs an unchanged stay at most this often (buffer_shadow.py; the code's own fallback)
    held_max_age_s: 600    # held.json offsets older than this are not restored at start (the stick may have moved)
    resume_poll_s: 0.5     # how often a hold's resume re-reads playback while it settles
    resume_settle_s: 6     # [overseer Nov 7] a hold's PLAY may read 'stopped' for a moment (Prime re-buffering): wait this long for 'playing'
    shadow: true           # [Nick 9:10 AM Nov 5, buffer = main architecture] with enabled off: an editor decider runs
                           # every game B s behind live and logs each decision to data/buffer_shadow.jsonl; no stick
                           # or screen change (redzone/buffer_shadow.py). Lane 3 grades it vs live for the RC8 gate
    shadow_overrides: {"decider.entry.start_timed": true}   # the editor's own settings (flat dotted keys); the live
                           # decider keeps its own (planner: the night lab's untimed NBA start joined 10 s after tip)
    apps: [youtubetv, primevideo]   # apps whose player pauses and resumes on the hidden stick
    prime_buffer: false    # [S-9, PARK-UNIFY] OFF. "primevideo" above never matched a "prime:<gti>" target in the fresh-tune
                           # buffer (control._buffer_for), so a Prime hidden tune was never held behind live there (the
                           # buffered-jump pause-hold already matched both). On: both spellings match there too, so Prime
                           # tunes get up to max_s of pause. Judged unsafe on the Nov 7 record (handoff 2026-11-09): Nick's
                           # call. PARK's own Prime hold (park.prime) never reads this
    hold_overreport_s: 0   # [hold calibration] fallback only (no stick positions): the wall span less this. 0 =
                           # the span as is. At 1.5 it fought hold_cal_s (a rebuild's pause is already short by
                           # 1.5 s), so the STK-06 watchdog rebuilt a 2.9 s gap forever on the night lab (Nov 4)
    hold_cal_s: -1.5       # a rebuild's pause is this much off the gap it closes (Nick's live hold calibration)
    rc8_on: false          # [RC8, Nick Nov 5 9:10 AM] the buffer-ON release, per league ONLY (league_overrides.<lg>):
                           # the stream is held B s behind live with B from the adaptive formula below (it implies
                           # the hold above for that league). Nick flips it himself (scripts/rc8_flip.py); the
                           # pre-registered gate (docs/plans/2026-11-05-rc8-buffer-gate.md) is reported per league
                           # by scripts/rc8_gate_report.py. Ships false everywhere. Code: redzone/buffer_rc8.py
    scrub_after_tune_s: 22 # [overseer Nov 8 21:55] the first overlay key waits this long after a tune reports playing:
                           # YouTube TV's LIVE/title banner (up to ~30 s) swallows the keys ('no scrub label', 62 s)
    scrub_banner_retry_s: 30   # a scrub that failed on the banner / focus guard is retried after this (others: scrub_retry_s)
    label_reader: false    # [YTTV scrub buffer item 2, Nick Nov 6 10:15 PM] read YouTube TV's overlay time label (screencap ->
                           # local OCR -> numbers; the frame is deleted at once, never kept) as the behind-live truth
                           # meter after a scrub seek (media_session lies after a seek). Code: redzone/tuners/yttv_label.py
    scrub_entry: false     # [scrub entry, Nick Nov 6 order item 4] YouTube TV: put the hidden stick B s behind live by the
                           # overlay scrub (yttv_seek.enter_buffer: CENTER, N x LEFT, CENTER) BEFORE the flip, never by
                           # a pause (a pause doesn't hold: docs/sync/2026-11-06-yttv-scrub-buffer-spec.md). held = the
                           # overlay label's reading, not media_session. Per league (league_overrides.<lg>); also needs
                           # yttv_seek.enabled. OFF until a stick flip onto a scrubbed stream is proven
    scrub_fallback: keep   # a failed scrub: keep = keep the current game (no flip to an unread offset); live = flip at
                           # the live edge as today
    scrub_cost_s: 28       # seconds the scrub adds before a flip (deadline_cost): ~15-20 s presses with the tune banner + ~8 s read;
                           # the measured p90 (latency key yttv_scrub) wins once it's larger
    scrub_read_s: 8        # one label read adds this much delay: ask B - this so the picture lands near B
    scrub_over_s: 15       # a label reading above max_s + this fails closed (ACC Network stopped near 150 s)
    scrub_retry_s: 120     # a target whose scrub failed isn't scrubbed again for this long
    scrub_trust_s: 1200    # a scrubbed stream counts as on its target this long (one 20-min hold proven), then re-tunes
    rc8_fixed_s: 0         # a league pinned to this B instead of the formula (0 = the formula)
    adaptive:              # [Nick 9:35 AM] B = feed-lag p95 + sync error + tune/seek + margin, never 0
      floor_s: 15          # hard floor: a play is always known before it's shown (Nick: ~10-15 s; gate v28: 15 in RC8,
                           # 10 s is Nick's later call)
      ratchet_step: 15     # gate v28: B ratchets down at most this much per release, only after a locked read held
      margin_s: 5
      sync_err_s: 2        # RC7 bar: per-stick sync p95 <= 2 s
      tune_seek_s: 6       # a fresh tune or a seek on the hidden stick (scorecard tune 5 s + settle)
      stream_delay_credit_s: 0   # s of the app's own stream delay credited against feed lag (0 = Nick's formula
                                 # as written; only lowered after a locked gate holds)
      feed_lag_p95_s: {nfl: 62, cfb: 62, nba: 70, cbb: 46, wcbb: 46, nhl: 75, mlb: 60}   # P90 PLACEHOLDERS
                                 # (noggin.pick.FEED_LAG_P90) until T6's per-league feed-lag table gives real p95s
      approved_min_s: {nfl: 0, cfb: 0, nba: 0, cbb: 0, wcbb: 0, nhl: 0, mlb: 0}   # the lowest B a LOCKED gate
                                 # approved per league; 0 = none yet, so a held league never goes below its live B
  measured: false          # [TIMING-TRUTH] OFF: true = the catch-up route (noggin/catchup.Route built by the decider) and
                           # scripts/veto_audit.py --timing measured read the stick timings below, measured on Nick's TV
                           # Nov 9 (small samples, on a busy Mac: TV test 3e re-times prep on a quiet one). Off = each
                           # reads its own constant as before (flip 3.2, clip prep 15, reach arbiter.catchup_route_reach_s)
  flip_s: 1.9              # input flip through SmartThings, median (9 of 9 at 1.83-2.22 s)
  flip_max_s: 2.2          # ...the slowest of those 9: the route plans every flip with this one
  tune_s: 3.0              # tune to another channel, picture confirmed: typical (n = 13, 2.3-4.3 s)
  tune_max_s: 4.3          # ...the slowest of those 13
  clip_prep_s: 19.0        # the hidden stick loads a clip: tune + 3 s wait + seek (18.0-19.0 s typical, n = 6)
  clip_prep_max_s: 25.0    # ...the slowest (24.8 s)
  seek_base_s: 28.7        # a seek lands this far behind live with no LEFT press (time label, 6 of 6, two games)
  seek_per_press_s: 16.5   # ...plus this much per LEFT press
  reach_s: 175             # deepest seek reached (about 175-177 s); catchup.HARD_CAP_S (180) still caps the route
  # [POSITION-FIX, Nov 10 TV, research/position FINDINGS] each OFF; flag off = today's behaviour (redzone/tuners/yttv_timing.py)
  label_stamp_at_pause: false    # a label read is timed at the media session's pause event, paired with the position the commit lands on
  playback_with_package: false   # YouTube TV playback reads pass the app's package (a paused YouTube TV session is invisible without it)
  no_right_probe_at_live: false  # at the live edge no RIGHT after the LEFT probe (it does not undo it); the LEFT is booked as 15.000 s
  per_tune_offset: false         # a fresh YouTube TV tune's own lag is unknown (sd 1.2-2.0 s) until one absolute read on that tune
  per_tune_offset_sd_s: {default: 2.0, espn: 1.24, fs1: 1.98}   # that spread per channel (n=21 espn, n=10 fs1, one night)
  stats_for_nerds: false         # read Live Latency off the Stats for nerds panel at the live edge (redzone/tuners/yttv_nerds.py)
  key_constants: false           # pause/resume timed with each stick's own key delays below, not the round trip
  key_constants_by_stick:        # MEDIA_PLAY_PAUSE: frozen frame this long after the key; playing this long after the resume key
    "Fire TV Stick 4K (2023)": {pause_s: 0.70, resume_s: 0.69, sd_s: 0.13}   # n=11 each
    "Fire TV Stick 4K Plus": {pause_s: 0.60, resume_s: 0.53, sd_s: 0.08}     # n=6 each
  game_offset: false             # per-game K (YouTube-clock time of a frame minus the feed time on it) from game_offset_file; no K = delay unknown
  game_offset_file: ""           # any K file shape (noggin/k_table.k_rows), only rows naming a game id; empty = off (redzone/decider/tune_offset.py)
  # [POSITION-FIX] measured numbers the helpers above read once from this file (not live settings; Nov 10 TV, hidden 2023 stick)
  yttv_left_step_s: 15.0         # one committed LEFT lands exactly this far back (69 of 69 single steps)
  nerds_shots_s: [11.0, 17.0, 22.0]   # Stats for nerds: Live Latency is readable about 11-23 s after a fresh tune
  nerds_latest_s: 23.0           # ...past this after the landing it reads 0.00 again
  nerds_bias_s: 0.34             # Live Latency minus the label's U, mean (espn +0.29 n=6, fs1 +0.42 n=4)
  nerds_sd_s: 0.19               # ...its spread: one Live Latency read knows the tune's offset to this
  dead_v2: false           # [DEAD-V2] OFF: true = a caller sizes an open stoppage's sure dead time by break class (an NFL timeout
                           # the feed calls official is a commercial, "Timeout #n by TEAM" is short) and by the time already run
                           # (scoring/dead_left_lite.guaranteed_left, table broadcast/dead_left_table.json, train nights only).
                           # Off = dead_left.guaranteed_left, the pooled quantile less the elapsed time, as before. No app code
                           # reads it yet (salvaged from branch anchor-mode without its anchor mode). Simulated only (ledger L1, L5)

delay:                     # seconds your screen runs behind real life, per app; "I just saw it" measures it
  default: {youtubetv: 45, prime: 40, espn: 40}  # espn (ESPN+) unmeasured: same as the code fallback
  sigma_default: 15
  model: channel           # channel: predict each channel (channels of one app differ, truTV 22 s vs FS1 42 s); legacy: one figure per app
  boundary: true           # [F-01] read the YouTube TV sticks around each quarter hour to time a show change (engine._boundary_loop; the code's own fallback)
  scorebug: true           # [F-01] the Prime score-bug reader loop runs while a Prime game is on screen (engine._scorebug_loop; the code's own fallback)
  timing:                  # [F-01] [timing] per-app stated doubt; null = absent = today (DelayBook.apply_timing_config)
    app_sigma: null        # {app: {sigma_s, min_anchors, meter_s, replay: <timing_replay's verdict>}}; needs its hold-out replay verdict
  scorebug_hidden: true    # [Nick 9:25 AM Nov 5] also read the bug on the hidden stick while its Prime preload is live
                           # (our fastest NFL "feed", ~16 s behind the arena); numbers only, never frames
  scorebug_log: true       # every bug read (score, clock, period, down) to data/scorebug_reads.jsonl for the feed race
  feed_lag_prior_s: 10      # [EXP-803 A5] feed lag assumed for a game until a play measures it (per league via
                           # league_overrides; measured q90: nba 69.7, nfl 62.5, nhl 71.3, redzone/lab/feed_lag_profile.json)
  scorebug_band: false     # [Nick Nov 5 3:30 AM, "Yes, read it"] Prime score bug: read only the lower third as raw
                           # pixels (no PNG encode on the stick, ~6.5 s a frame now); numbers kept, never frames
  scorebug_midpoint: false # [Nov 8] a frame's time = midpoint of its capture request and done, with its own doubt
  scorebug_clock_fit: false # [Nov 8] the running game clock fitted over a 30 s window of frames, not single reads
  feed_bias:               # [Nov 8] how late each feed's wall clock runs vs NBA timeActual, from scoring plays both report
    enabled: false         # learn it (shadow)
    apply: false           # take it out of the plays' wall clocks before the score bug is timed against them
  sync:                    # every channel's delay found automatically (redzone/decider/sync.py), no taps
    enabled: true          # Kalman filter per channel: show flips, score bug (score + clock), stick position, taps
    min_sigma_s: 4         # a synced channel's stated doubt never goes below this (the gates' tested floor)
    robust: false          # [Nov 8] Student-t weights + change points: one bad OCR read no longer costs 300 s of "uncertain"
    app_min_sigma_s: {}    # [Nov 8] per-app floor, e.g. youtubetv: {floor_s: 1.5, replay: {method: forward_chaining, folds: [...]}};
                           # refused without a forward-chaining replay showing no fold's mid-play cuts rose
    log: true              # every signal + estimate to data/sync.jsonl (scripts/eval_sync.py --log grades it)
  edge_model:              # [Nick Nov 6 order item 3] a scrubbed YouTube TV tune: delay = D_edge(channel) + behind_live,
    enabled: false         # behind_live read off the overlay time label (not media_session, wrong after a seek). OFF
    default: {youtubetv: 25}   # s the live edge runs behind real life with nothing better (research Nov 6: ~25 s +-3)
    default_sd_s: 3
    label_sd_s: 1.5        # one overlay label read
    edge_max_sd_s: 6       # tonight's at-the-edge estimate counts as the channel's D_edge only when this sure
  edge_prior:              # [Nick Nov 7, hidden stick ~10:55 ET] YouTube TV's live edge measured to sub-second on 11
                           # channels (ESPN, ESPN2, FS1, SECN, ACCN, NBA TV, TNT + locals FOX 50, CBS 17, ABC 11, WRAL
                           # tuned by search): 28 reads 34.3-35.5 s, mean ~34.9, sd ~0.4. ONE delay for every channel,
                           # measured against the EPG :00/:30 schedule clock. OFF
    enabled: false         # on: an unmeasured YouTube TV channel's prior (and the edge model's D_edge) is this, not
                           # the old per-channel taps (youtubetv:fs1 42 +-8) or the 25 s research default.
                           # The stated doubt still keeps the 4 s floor (delay.sync.min_sigma_s; the gates' floor)
    prior:
      youtubetv: {mu_s: 34.9, sd_s: 0.6}
    drift_cap_s: 2         # the prior's stated doubt grows at most this much over a night (4 -> 6 s, under
                           # decider.uncalibrated_sigma_s 8); a stall still widens it
    refresh:               # Nick's probe: fresh live edge (tune away -> back), CENTER, RIGHT, screencap + OCR, BACK;
                           # delay = (capture - EPG start) - label, start = the :00/:30 boundary. ~15 s on the hidden stick
      enabled: false       # run it from keepalive on the hidden stick (only at the live edge, never on a buffer)
      min_gap_s: 1800      # at most one probe per this many seconds (tried or not)
      max_age_s: 10800     # probe reads older than this no longer count (back to the prior)
      keep: 6              # median of the newest this many reads
      band_s: 10           # a read further than this from the prior is a misread (skipped, logged)
      max_label_gap_s: 120 # (capture - label) must sit this close past a :00/:30 boundary, else no boundary start
      boundary_s: 1800     # EPG programs start on the :00 / :30
      relink_gap_s: 3      # between the reset tune and the tune back (Nick's run: 2/12 "video never started" without)
      after_tune_s: 2      # wait after the fresh tune before CENTER
      overlay_wait_s: 1.3  # after CENTER / RIGHT, wait this long before the screencap
      left_offset_s: 0     # no label after RIGHT (FOX 4K game feed): one LEFT; s the knob sits before the live edge then
                           # (0: at the live edge a LEFT doesn't move it, 12f405ab LEFT 6/6)
  self_calibrate:          # [self-calibrating doubt] stated doubt learned from break-anchor innovations (NoiseCal), OFF
    enabled: false         # sims only so far (eval_sports --break-anchors); live needs the pool persisted across nights
    min_n: 20              # residuals (first anchor after a tune) before it speaks
    min_sigma_s: 2         # floor of the learned doubt (the 4 s sync floor stays for the filter itself)

break_lengths_s:           # typical commercial lengths used to plan catch-ups
  nfl: {timeout: 75, tv_timeout: 120, score_break: 150, end_period: 120, two_minute_warning: 150, halftime: 780}
  nba: {timeout: 90, end_period: 130, halftime: 900}
  nhl: {timeout: 120, end_period: 150, intermission: 1130}
  mlb: {end_period: 130, pitching_change: 150}

noggin:                    # docs/noggin.md
  belief:
    enabled: false         # [EXP-023] the belief tracker (redzone/noggin/belief.py) as the delay sync in place of the Kalman filter. OFF: its dev bar failed (#223)
  priority:
