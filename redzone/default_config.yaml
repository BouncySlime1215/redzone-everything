park:                      # [PARK, integration plan unit 0b] the two-stick show run by the app itself: the hidden stick is paused on the
                           # next game; a jump resumes it, flips the TV input and pauses the stick that was left
  enabled: false           # OFF. The planner, the facts and the timing model are in redzone/noggin/park_*.py; the stick steps
                           # (tune, place, park, jump, finish) are Controller.park_* in redzone/control.py (unit PARK-HANDS),
                           # which refuse unless this, sound_guard.enabled and sound_guard.must_be_silent are all on. Nothing calls
                           # them until the decision-path owner (unit PARK-CONTROLLER) does
  max_park_s: 180          # the park age cap: a stick paused longer than this is stale; the show tunes it afresh and never jumps
                           # onto it. 180 = the longest hold whose place was READ BACK after its resume (4 pauses of
                           # 20-180 s on one channel, ledger L74); nothing longer, no other channel, has been read
  late_cap_s: 145          # ...and so is one whose picture is more than this behind its stream's live edge (finding 5, ledger L45)
  pad_k: 4.0               # [PARK-TIMING-CONFIG] each game's padding = pad_k x the root of the summed squares of its error parts
                           # (park.timing below; redzone/noggin/park_timing.py TimingParams). The code read this key before; the
                           # config now accepts it. Every value here is the code's own default, so nothing changes until it is set
  timing:                  # [PARK-TIMING-CONFIG] the error parts (sd, seconds) and the priors behind each game's padding
    read_sd: 0.29          # the position read once per tune (a label read is a whole-second floor)
    tune_sd: 1.5           # a tune that was not read: it lands 1.2-2.0 s (sd) off its nominal lag
    k_sd_min: 0.5          # K is never trusted tighter than this (noggin/k_table.K_SD_MIN). Raising it widens ONLY games that have
                           # a K: 1.91 gives 8 s on a read tune in every league (NBA, college, football); games with no K stay wide
    stamp_sd_nba: 0.33     # ESPN NBA play stamps against the game clock
    stamp_sd_college: 0.5  # college stat crews: looser
    stamp_sd_football: 0.4  # football play stamp against the snap (one Prime replay, Nov 11): football padding about 3 s
    key_sd: 0.13           # a key's landing
    eyes_sd: 0.3           # an edge the clock watcher saw itself
    prior_delay: 33.0      # no K: a feed stamp to a stick's live edge on the wall clock...
    prior_sd: 12.0         # ...and its doubt: a game with no K is padded about 4 x 12 = 48 s
    live_lag: null         # null: park.steps.live_lag_s decides; a number here wins over it (ParkHands._live_lag)
    k_stale: 1800.0        # Eyes's K keeper calls a read older than this stale
  read_guard: false       # [PARK-UNIFY] OFF. On: the read gesture has the other overlay gestures' whole focus guard
                           # (yttv_seek.front_and_playing before ANY key, #356: YouTube TV in front and playing; and no
                           # committing CENTER on a frame whose focus was never read). Off: only the commit is guarded, and
                           # only when a frame was read (as merged in PR 425)
  reread_in_place: false   # [PARK-UNIFY] OFF. On: the show's re-read of a drifted stream ON SCREEN puts the knob back (RIGHT
                           # once per LEFT) before its commit, so the picture is not sent ~30 s back in front of the viewer, and
                           # a failed re-read never reloads the picture on screen. Off: as merged (commit 30 s back; a fresh tune
                           # if the read fails). RIGHT behind the live edge is unmeasured on the TV: the seek check catches it
  verify_game: false       # [PARK-VERIFY-GAME] OFF. On: after every tune the words on the picture name the game (YouTube TV: the read
                           # gesture's own overlay text, no extra screenshot; Prime: one screenshot + text read). Another live
                           # game's two teams named = the WRONG game: that stream is refused and the show re-picked without the
                           # pair for 30 min. Nothing readable = UNKNOWN: the game's K is kept back (wide padding) until its
                           # picture confirms it; a guessed channel (Peacock -> NBCSN) is UNKNOWN the same way (noggin/park_verify.py)
  verify_hold_s: 1800      # [PARK-VERIFY-GAME] a game whose channel's picture showed another game is not taken again for this long
  picture_grade:          # [PARK-CONFIG-KEYS] the picture grader sidecar (redzone/picture_sidecar.py, PR 432): OFF; the code's defaults
    enabled: false         # OFF
    tool: ""               # the grader program's path (empty: no sidecar)
    python: ""             # the Python that runs it (empty: the app's own)
    args: []               # extra arguments
  picture_check:          # [PARK-CONFIG-KEYS] the live picture check (picture_sidecar.LIVE_CHECK_KEY): OFF, nothing calls it yet
    live: false            # OFF
