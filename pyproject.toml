[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "mac_only: needs macOS itself (Swift helpers, Vision, sips); skipped on Linux CI",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", ".venv-agent", ".rz_tmp", ".xfer", ".claude-xfer", "data"]

[tool.ruff.lint]
# CI blocks on real errors only: syntax errors, undefined names, broken format strings,
# misused `is`/comparisons, `return` outside a function. Style and unused names are not gated
# (pytest fixtures imported into test modules look like F811 redefinitions).
select = ["E9", "F5", "F6", "F7", "F82", "F402", "F404", "F406", "F407"]
