# Auto-fix (BRAIN tier): the watchdog on the Mac files an issue labeled `auto-fix`; Claude (the
# user's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN, no API key) diagnoses it and writes a fix
# plus a regression test; scripts/autofix_guard.py refuses anything that touches CI, gates, tests'
# strength or secrets; the full test suite and the end-to-end night must pass; then a DRAFT PR goes
# into integration/next and CI runs on it. Nothing merges or deploys from here. See docs/auto-fix.md.
#
# Kill switch: set the repository variable AUTOFIX_ENABLED to false (Settings > Secrets and
# variables > Actions > Variables). Daily cap: AUTOFIX_MAX_PER_DAY (default 3).
name: auto-fix

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: issue number to fix
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write        # to start CI on the fix branch (pushes by the built-in token don't)

concurrency:
  group: auto-fix       # one fix at a time, never cancelled half-way
  cancel-in-progress: false

jobs:
  fix:
    # Only issues carrying the label, filed or labeled by the repository owner (the Mac files as
    # the owner), and only while the kill switch is not thrown.
    if: >-
      vars.AUTOFIX_ENABLED != 'false' && (
        github.event_name == 'workflow_dispatch' ||
        (contains(github.event.issue.labels.*.name, 'auto-fix') &&
         github.actor == github.repository_owner &&
         github.event.issue.state == 'open'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: preflight (secret present, daily cap, not already handled)
        id: pre
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          MAX: ${{ vars.AUTOFIX_MAX_PER_DAY || '3' }}
        run: |
          set -euo pipefail
          say() { gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "$1

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"; }
          if [ "$HAS_TOKEN" != "true" ]; then
            say "Auto-fix is set up but the CLAUDE_CODE_OAUTH_TOKEN secret is missing, so nothing ran. See docs/auto-fix.md (2 minutes)."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/branches/autofix/issue-$ISSUE" >/dev/null 2>&1; then
            echo "already handled (branch autofix/issue-$ISSUE exists)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && \
             gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx auto-fix-ran; then
            echo "auto-fix already ran on this issue (re-run it by hand with workflow_dispatch)"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          # Issues auto-fix ran on that were touched today (conservative: a comment counts too).
          ran=$(gh api -X GET "repos/$GITHUB_REPOSITORY/issues" -f labels=auto-fix-ran -f state=all -f since="${today}T00:00:00Z" \
                -f per_page=100 --jq 'length')
          if [ "$ran" -ge "$MAX" ]; then
            say "Auto-fix daily limit reached ($MAX runs today). It will not run on this issue; re-run the workflow tomorrow or fix by hand."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh label create auto-fix-ran -R "$GITHUB_REPOSITORY" --color BFD4F2 --description "auto-fix ran on this issue" 2>/dev/null || true
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label auto-fix-ran
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pre.outputs.go == 'true'
        with:
          ref: integration/next
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.pre.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: install (same as CI)
        if: steps.pre.outputs.go == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg
          pip install -r requirements.txt ruff==0.16.9

      - name: hand Claude the issue (as a file, never inside the prompt)
        if: steps.pre.outputs.go == 'true'
        run: |
          mkdir -p .autofix
          gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title,body --jq '"# " + .title + "\n\n" + .body' > .autofix/issue.md
          sed "s/__ISSUE__/$ISSUE/" .github/auto-fix/prompt.md > .autofix/prompt.md
          echo "PROMPT<<EOF_PROMPT" >> "$GITHUB_ENV"; cat .autofix/prompt.md >> "$GITHUB_ENV"; echo "EOF_PROMPT" >> "$GITHUB_ENV"

      - name: Claude diagnoses and fixes
        if: steps.pre.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ env.PROMPT }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python -m pytest:*),Bash(ruff check:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(git push:*),Bash(git commit:*),Bash(gh:*),Bash(curl:*),Bash(env:*),Bash(printenv:*)"

      - name: guard (no CI/gate/test weakening, no secrets, has a regression test)
        if: steps.pre.outputs.go == 'true'
        id: guard
        run: |
          mv .autofix /tmp/autofix   # Claude's notes are not part of the fix
          python scripts/autofix_guard.py --base origin/integration/next | tee /tmp/autofix/guard.txt

      - name: the gates (end-to-end night, full test suite, ruff)
        if: steps.pre.outputs.go == 'true'
        run: |
          shopt -s nullglob
          e2e=(tests/test_e2e*.py)
          if [ ${#e2e[@]} -gt 0 ]; then python -m pytest -q -p no:cacheprovider "${e2e[@]}"; fi
          python -m pytest -q -p no:cacheprovider
          ruff check .

      - name: open a draft PR into integration/next and start CI on it
        if: steps.pre.outputs.go == 'true'
        run: |
          set -euo pipefail
          git config user.name "redzone-autofix"
          git config user.email "redzone-autofix@users.noreply.github.com"
          branch="autofix/issue-$ISSUE"
          git checkout -b "$branch"
          git add -A
          git commit -q -m "Auto-fix #$ISSUE: $(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title --jq .title | cut -c1-60)" \
                     -m "Diagnosed and written by Claude (claude-code-action) from the watchdog's report; guard and gates passed in the auto-fix workflow."
          git push -u origin "$branch"
          {
            if [ -s /tmp/autofix/summary.md ]; then cat /tmp/autofix/summary.md; else echo "(Claude left no summary)"; fi
            echo; echo "---"
            echo "Fixes #$ISSUE (filed by the watchdog). Guard: $(tail -n1 /tmp/autofix/guard.txt)."
            echo "Gates run before this PR: end-to-end night test, full test suite, ruff. CI and the scorecards run on this PR too."
            echo "Merging is integration's or the user's call. After a merge, scripts/deploy.py ships only when no game is live and rolls back on its own if health gets worse."
            echo; echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > /tmp/autofix/pr.md
          gh label create auto-fix -R "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
          url=$(gh pr create -R "$GITHUB_REPOSITORY" --draft --base integration/next --head "$branch" \
                --title "Auto-fix #$ISSUE: $(gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title --jq .title | sed 's/^\[auto-fix\] //' | cut -c1-80)" \
                --body-file /tmp/autofix/pr.md --label auto-fix --assignee "$GITHUB_REPOSITORY_OWNER")
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Claude wrote a fix: $url (draft, CI running).

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: report a refused or failed fix on the issue
        if: failure() && steps.pre.outputs.go == 'true'
        run: |
          {
            echo "Auto-fix did not open a PR: the guard refused the change or a gate failed. Nothing was pushed."
            echo
            if [ -s /tmp/autofix/guard.txt ]; then echo '```'; cat /tmp/autofix/guard.txt; echo '```'; fi
            if [ -s /tmp/autofix/summary.md ]; then echo; echo "Claude's notes:"; echo; cat /tmp/autofix/summary.md; fi
            echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo; echo "---"; echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/fail.md
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body-file /tmp/fail.md
