# Build eval-data-v2 (cycle 01 plan, task 4 / EVAL2) on a free GitHub runner: ESPN is blocked in cloud
# sessions and the Mac never runs heavy jobs. Starts from the pinned v1 files, backfills (new nights
# after v1 + last season's your-team nights for NBA/NHL) until every league has >= 8 locked nights,
# builds the deterministic tarball, checks leaks on it, and publishes release `eval-data-v2` ONLY if
# that tag does not exist yet (an existing tag's asset is never replaced: older PRs pin it).
# The lock (eval-data-v2.lock.json) is a release asset too; a PR commits it next to v1's.
name: eval-data-v2
on:
  push:
    branches: [claude/eval-data-v2]
    paths: ["scripts/backfill_eval_v2.py", ".github/workflows/eval-data-v2.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # v2 (END 20261103) is published but its locked set reaches back over 3-4 v1 dev nights, so
      # leak_check now FAILs it. v3 waits for enough FRESH nights (>= 8 locked nights all at or after
      # v1's locked start, Oct 29): the Nov 5 night, so build it Fri Nov 6 morning.
      TAG: eval-data-v3
      END: "20261105"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: v1 files (the starting point)
        run: python scripts/fetch_eval_data.py
      - name: backfill
        id: bf
        # NOT READY (too few fresh locked nights yet) is an expected state, not a red build: the
        # remaining steps are skipped and nothing is published. Re-run once the nights are final.
        run: |
          if python scripts/backfill_eval_v2.py --end "$END" --json /tmp/backfill.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG not ready: see the split above (nothing built or published)"
          fi
      - name: build tarball + lock
        if: steps.bf.outputs.ready == 'true'
        run: |
          python scripts/build_eval_data.py --tag "$TAG" --out /tmp/evaldata --lock "$TAG.lock.json" \
            --window nfl:20250905:$END --window nba:20260101:$END --window nhl:20260101:$END --demo 20261101
          cp "$TAG.lock.json" /tmp/evaldata/
          cp /tmp/backfill.json /tmp/evaldata/backfill-report.json
      - name: leak check on v2
        if: steps.bf.outputs.ready == 'true'
        env: {RZ_EVAL_LOCK: "${{ env.TAG }}.lock.json"}
        run: |
          python scripts/fetch_eval_data.py --tgz /tmp/evaldata/eval-archive.tgz --force
          python scripts/fetch_eval_data.py --check
          python scripts/leak_check.py
      - uses: actions/upload-artifact@v4
        if: steps.bf.outputs.ready == 'true'
        with:
          name: ${{ env.TAG }}
          path: /tmp/evaldata/
          retention-days: 14
      - name: publish release (new tag only)
        if: steps.bf.outputs.ready == 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists: not replacing it (artifact has this run's build)"; exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Pinned eval data $TAG: >= 8 locked nights per league, none of them a v1 dev night (cycle 01 task 4). See $TAG.lock.json and backfill-report.json." \
            /tmp/evaldata/eval-archive.tgz /tmp/evaldata/eval-archive.tgz.sha256 \
            "/tmp/evaldata/$TAG.lock.json" /tmp/evaldata/backfill-report.json
