# North Star (nightly + on every merge): one table of where integration/next stands against "perfect" (scripts/northstar.py),
# with night-level cluster-bootstrap CIs, on dev-test AND locked nights, plus 8 seeds of the e2e fault night.
# Commits docs/northstar.md, docs/northstar-history.jsonl and docs/roadmap.md back to integration/next
# (docs only, so the push triggers nothing) and always uploads them as an artifact. Free tier only.
name: North Star

on:
  # GitHub fires `schedule` (and lists `workflow_dispatch`) only from the DEFAULT branch (main), which this
  # repo never merges to. So the job runs on every push to integration/next (each merge refreshes the
  # table; its own docs-only commit is ignored), and the cron takes over if the file ever reaches main.
  push:
    branches: [integration/next]
    paths-ignore: [docs/northstar.md, docs/northstar-history.jsonl, docs/roadmap.md, "docs/nights/**"]
  schedule:
    - cron: "0 10 * * *"     # 5-6 AM ET, before the director's morning re-rank
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: northstar
  cancel-in-progress: true    # a burst of merges: only the newest integration/next is worth a table

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  northstar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/next
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: system tools (as in ci.yml; the e2e night needs them)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg
      - run: pip install -r requirements.txt
      - name: pinned eval data (eval-data-v1, 24 MB, sha256-checked)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_eval_data.py
      - name: controls drill (phone presses in 4 replayed nights, taps lost and duplicated on purpose)
        # Shipped defaults (no --pretune). Exit 1 = a dropped/broken press: the North Star line says so.
        run: python scripts/controls_drill.py --seeds 4 --hours 3 --flaky --json controls.json || true
      - name: North Star (dev + locked, 8 e2e fault nights)
        # Live nights: the Mac's per-night summaries, published to docs/live-nights/ (scripts/publish_live_nights.py).
        # The runner has no data/live_nights, so without this the section is PENDING forever.
        run: |
          LIVE=""
          if python scripts/northstar.py --help | grep -q -- --live-dir; then LIVE="--live-dir docs/live-nights"; fi
          python scripts/northstar.py --night-seeds 8 --controls-json controls.json --json northstar-raw.json $LIVE
          cat docs/northstar.md >> "$GITHUB_STEP_SUMMARY"
      - name: night health report (report.nightly; writes nothing while the flag is off)
        run: python scripts/night_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: northstar
          path: |
            docs/northstar.md
            docs/northstar-history.jsonl
            docs/roadmap.md
            northstar-raw.json
      - name: commit the result to integration/next
        run: |
          git config user.name "redzone-northstar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/northstar.md docs/northstar-history.jsonl docs/roadmap.md
          [ -d docs/nights ] && git add docs/nights
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "northstar: nightly table $(date -u +%F) [skip ci]"
          # The train may have merged meanwhile: rebase the docs-only commit and retry a few times.
          for i in 1 2 3 4; do
            git pull --rebase --depth=50 origin integration/next && git push origin HEAD:integration/next && exit 0
            sleep $((2 ** i))
          done
          echo "::warning::could not push to integration/next (protected or racing); the artifact has the result"
