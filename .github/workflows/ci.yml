# CI for every pull request: tests on Linux, ruff for real errors, and a fast scorecard smoke run
# on the pinned eval dataset (PR vs base, same data). The numbers go into one PR comment that each
# push updates. Free tier only: public repo, GitHub-hosted ubuntu runners, the built-in token.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [codex/resume-redzone, integration/next, integration/release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The pinned eval dataset (see the "Pin one eval dataset" work): a release asset, cached here.
  EVAL_DATA_TAG: eval-data-v1
  EVAL_DATA_ASSET: eval-archive.tgz
  PYTHONDONTWRITEBYTECODE: "1"
  # The integration train gets every scorecard in full; other PRs get the fast smoke slice.
  RZ_SCORECARD_FULL: ${{ (github.event_name == 'merge_group' || github.base_ref == 'integration/next' || github.ref == 'refs/heads/integration/next' || github.ref == 'refs/heads/integration/release' || github.event_name == 'workflow_dispatch') && '1' || '0' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - name: ruff (real errors only, rules in pyproject.toml)
        run: |
          set +e
          ruff check --output-format concise . > lint.txt 2>&1
          echo $? > lint-status.txt
          cat lint.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: lint
          path: lint*.txt
      - name: fail on lint errors
        run: test "$(cat lint-status.txt)" = 0
      - name: contract kernel (new violations fail; baseline in docs/contract_baseline.json)
        run: python scripts/contract_check.py
      - name: every module says what it is and why (ratchet, docs/module_headers_baseline.json)
        run: python scripts/module_headers.py

  memory:
    # CLAUDE.md and docs/memory/ links resolve; a PR that changes a default or a gate also adds a
    # dated line to docs/memory/decisions.md (scripts/check_memory.py, CLAUDE.md "Memory").
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: memory links and decisions log
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/check_memory.py --base "origin/$BASE_REF"
          else
            python scripts/check_memory.py
          fi
      - name: state machine doc is current
        # redzone/machines/ specs -> docs/state-machines.md (stdlib only, no install needed).
        run: python scripts/state_machines.py --check
      - name: agent reports follow docs/STANDARD.md (front matter, ids, generated index)
        run: pip install pyyaml >/dev/null 2>&1 || true; python scripts/doc_index.py --check
      - name: no edits inside another agent's open claim
        # docs/coordination.md "Claims": one writer per file across parallel agents.
        if: ${{ github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/claims.py check --base "origin/$BASE_REF"
      - name: every commit says why
        if: ${{ github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/commit_why.py --base "origin/$BASE_REF"
      - name: a fix carries a regression test; no deleted or skipped tests
        # W1-RULES gap 1. Title and body come through env, never spliced into the script.
        if: ${{ github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/fix_needs_test.py --base "origin/$BASE_REF"
      - name: one plan, with its required sections
        run: python scripts/plan_check.py
      - name: results ledger intact and append-only (W2-LOCKED, scripts/results_ledger.py)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/results_ledger.py verify --base "origin/$BASE_REF"
          else
            python scripts/results_ledger.py verify
          fi

  graders:
    # docs/grading.md: graders are frozen by the integrator (G1), experiments are pre-registered (G2)
    # and a running experiment keeps its goalposts (G3). scripts/grading_check.py.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: grader freeze, pre-registration, goalposts
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/grading_check.py --base "origin/$BASE_REF"
          else
            python scripts/grading_check.py
          fi
      - name: license tags (F8, personal-use data)
        run: python scripts/license_check.py
      - name: Context-only label leak check (v17)
        run: python scripts/label_leak_check.py

  data:
    # Fetch the pinned dataset once per tag, verify its sha256, and keep it in the Actions cache.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      available: ${{ steps.fetch.outputs.available }}
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: eval-data
          key: eval-data-${{ env.EVAL_DATA_TAG }}-v1
      - name: download and verify
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p eval-data
            if ! gh release download "$EVAL_DATA_TAG" -R "$GITHUB_REPOSITORY" -D eval-data \
                 -p "$EVAL_DATA_ASSET" -p "$EVAL_DATA_ASSET.sha256"; then
              echo "::warning::pinned eval dataset $EVAL_DATA_TAG is not published yet; scorecard smoke skipped"
              rm -rf eval-data
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          cd eval-data
          # The .sha256 file names the asset; check only that line, by our asset name.
          grep -E "[[:space:]]\*?$EVAL_DATA_ASSET\$" "$EVAL_DATA_ASSET.sha256" | sha256sum -c -
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.available == 'true'
        with:
          name: eval-data
          path: eval-data
          retention-days: 1

  # The Linux tests are three jobs per Python version (CI-FIX, Nov 10). On one job the suite outgrew its 45
  # min limit: ~7,000 unit tests plus the e2e nights (17-23 min) need ~75 min on a slow runner. Now:
  #   e2e            the replayed nights (whole-night system test, the integration gate), on their own
  #   test           the unit suite in SHARDS parallel jobs, split by file (scripts/ci_shard.py)
  #   test-results   proves the shards ran every file exactly once, merges the junit, playbook coverage
  e2e:
    needs: data
    # Tests run even if the dataset job failed (a bad checksum must not hide test results).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 17-23 min on Nov 10 (42 tests, 6 files) + ~1 min setup; apt is capped at 14 below
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: system tools (PortAudio for sounddevice, ffmpeg for the catch-up reel, as on the Mac)
        # A slow mirror took 16-21 min here (Nov 4) and starved pytest of the job's time: cap each try at
        # 6 min, retry once, with apt's own per-request timeout and retries.
        timeout-minutes: 14
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2; do
            timeout 360 sh -c "sudo apt-get $APT update -qq && sudo apt-get $APT install -y --no-install-recommends libportaudio2 ffmpeg" && exit 0
            echo "::warning::apt try $i timed out or failed, retrying"
          done
          exit 1
      - run: pip install -r requirements-ci.txt    # requirements.txt + pandas/pyarrow for the data-crew shard tests
      - uses: actions/download-artifact@v4
        if: needs.data.outputs.available == 'true'
        with:
          name: eval-data
          path: eval-data
      - name: unpack pinned data (archive-backed tests run when it is there)
        if: needs.data.outputs.available == 'true'
        run: tar -xzf "eval-data/$EVAL_DATA_ASSET"
      - name: leakage checks (research 05 §3; PENDING never fails, FAIL does)
        run: python scripts/leak_check.py
      - name: end-to-end replayed night (when the suite has it)
        # The whole-night system test (real Engine + Controller + fakes) is the integration gate.
        run: |
          shopt -s nullglob
          e2e=(tests/test_e2e*.py)
          if [ ${#e2e[@]} -eq 0 ]; then echo "no end-to-end night test in this branch yet"; exit 0; fi
          python -m pytest -q -rs -p no:cacheprovider --durations=15 --junitxml=e2e-${{ matrix.python }}.xml "${e2e[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.python }}
          path: e2e-${{ matrix.python }}.xml
          if-no-files-found: ignore
          retention-days: 7

  test:
    needs: data
    if: ${{ !cancelled() }}
    name: test (${{ matrix.python }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Each shard is ~1/4 of ~57 min of unit tests (Nov 10 estimate on the slower 3.12 leg) + ~1 min collection
    # + ~1 min setup: ~17 min, well inside 45 even with the 14-min apt cap.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2, 3, 4]    # keep in step with SHARDS in the test-results job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: system tools (PortAudio for sounddevice, ffmpeg for the catch-up reel, as on the Mac)
        timeout-minutes: 14
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2; do
            timeout 360 sh -c "sudo apt-get $APT update -qq && sudo apt-get $APT install -y --no-install-recommends libportaudio2 ffmpeg" && exit 0
            echo "::warning::apt try $i timed out or failed, retrying"
          done
          exit 1
      - run: pip install -r requirements-ci.txt
      - uses: actions/download-artifact@v4
        if: needs.data.outputs.available == 'true'
        with:
          name: eval-data
          path: eval-data
      - name: unpack pinned data (archive-backed tests run when it is there)
        if: needs.data.outputs.available == 'true'
        run: tar -xzf "eval-data/$EVAL_DATA_ASSET"
      - name: pytest, shard ${{ matrix.shard }} of 4 (mac_only tests are skipped by name on Linux; the e2e nights run in their own job)
        # Every shard collects the whole suite and keeps its own files (scripts/ci_shard.py); test-results
        # checks the shards' reports cover every file exactly once.
        run: >-
          python scripts/ci_shard.py run --shard ${{ matrix.shard }}/4 --report shard-${{ matrix.python }}-${{ matrix.shard }}.json --
          -q -rs -p no:cacheprovider --durations=15 --ignore-glob='tests/test_e2e*.py'
          --junitxml=unit-${{ matrix.python }}-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.python }}-${{ matrix.shard }}
          path: |
            shard-${{ matrix.python }}-${{ matrix.shard }}.json
            unit-${{ matrix.python }}-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7

  test-results:
    # One junit report per Python version (e2e + every unit shard) for playbook coverage and the CI comment.
    needs: [e2e, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: "{shard,e2e}-${{ matrix.python }}*"
          merge-multiple: true
      - name: the shards ran every unit test file exactly once
        run: python scripts/ci_shard.py check --count "$SHARDS" results/shard-${{ matrix.python }}-*.json
      - name: one junit report (unit shards + e2e)
        if: always()
        run: |
          python - "${{ matrix.python }}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          py = sys.argv[1]
          root = ET.Element("testsuites")
          files = [Path(f"results/e2e-{py}.xml")] + sorted(Path("results").glob(f"unit-{py}-*.xml"))
          for f in files:
              if f.exists():
                  r = ET.parse(f).getroot()
                  root.extend(r.iter("testsuite") if r.tag == "testsuites" else [r])
          ET.ElementTree(root).write(f"pytest-{py}.xml", encoding="utf-8", xml_declaration=True)
          PY
      - name: playbook coverage (a `done` entry must have a marked test that passed)
        # As before the split: judged when every test ran and passed (a failed test already fails its job).
        if: needs.e2e.result == 'success' && needs.test.result == 'success'
        run: python scripts/playbook_coverage.py --junit pytest-${{ matrix.python }}.xml
      - name: slowest test files (paste into scripts/ci_shard_weights.json when the shards drift apart)
        if: always()
        run: |
          python scripts/ci_shard.py weights results/unit-${{ matrix.python }}-*.xml > weights.json || exit 0
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          w = json.load(open("weights.json"))
          print(f"#### Slowest unit test files ({sum(w.values()) / 60:.1f} min in all)")
          for f, s in sorted(w.items(), key=lambda x: -x[1])[:15]:
              print(f"- `{f}` {s:.0f} s")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python }}
          path: pytest-${{ matrix.python }}.xml

  scorecard:
    needs: data
    if: needs.data.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: head/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg
      - run: pip install -r head/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: eval-data
          path: eval-data
      - name: one copy of the pinned data, linked into both checkouts
        run: |
          mkdir pinned && tar -xzf "eval-data/$EVAL_DATA_ASSET" -C pinned
          for co in head base; do
            [ -d "$co" ] || continue
            mkdir -p "$co/data"
            for d in pinned/data/*; do
              # Copy small files (eval_config.yaml etc.) so a scorecard can't change the pin through
              # a link; link the big archive folders.
              if [ -d "$d" ]; then ln -sfn "$PWD/$d" "$co/data/$(basename "$d")"; else cp "$d" "$co/data/"; fi
            done
          done
      - name: smoke run, PR
        run: python head/scripts/ci_scorecard.py --root head --out head.json
      - name: smoke run, base (same slice, same data)
        if: github.event_name == 'pull_request'
        run: python head/scripts/ci_scorecard.py --root base --out base.json
      - name: RAM/CPU of the decide() tick, PR vs base (scripts/perf_probe.py)
        continue-on-error: true
        run: |
          python head/scripts/perf_probe.py --root head --json perf-head.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python head/scripts/perf_probe.py --root base --json perf-base.json || true
          fi
      - name: North Star on dev-test nights, PR vs base (scripts/northstar.py; the locked set never goes in a PR delta)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python head/scripts/northstar.py --root head --split dev --no-write --json ns-head.json
          python head/scripts/northstar.py --root base --split dev --no-write --json ns-base.json
          python head/scripts/northstar.py --delta ns-head.json ns-base.json --md northstar.md
          cat northstar.md >> "$GITHUB_STEP_SUMMARY"
      - name: release gate on the LOCKED test split ("95% good minimum" + no overfitting, docs/architecture.md)
        # Report on every run; it only FAILS the job on the release PR (into codex/resume-redzone).
        # PENDING gates (not measurable yet) never count as passing. --robust adds sync +-3 s and a
        # dropping/late feed; those cards must pass the same hard gates.
        # W2-LOCKED-01: this repo is public, so the log and the summary get verdicts only. The raw scorecard stays in
        # $RUNNER_TEMP, outside the artifact glob below, and public-gate leaves out the value column.
        run: |
          locked="$RUNNER_TEMP/locked.json"
          python head/scripts/ci_scorecard.py --root head --split test --robust --no-resync --out "$locked" > /dev/null
          set +e
          python head/scripts/results_ledger.py public-gate "$locked" --baseline head/docs/gate_baseline.json --md gate-public.md
          rc=$?
          set -e
          rm -f "$locked"
          [ "$rc" -le 1 ] || { echo "::error::could not read the locked scorecard"; exit "$rc"; }
          { echo "#### Release gate (LOCKED test split + robustness): verdicts only"; cat gate-public.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ] && [ "${{ github.base_ref }}" = "codex/resume-redzone" ]; then
            echo "::error::release gate failed on the locked test split"; exit 1
          fi
      - name: drop per-night rows before the public artifact (smoke nights overlap the locked window, W2-LOCKED-02)
        id: scrub
        if: always()
        run: python head/scripts/results_ledger.py scrub head.json base.json
      - uses: actions/upload-artifact@v4
        # A failed scrub means no upload: a missing artifact is visible, a leaked one is forever.
        if: always() && steps.scrub.outcome == 'success'
        with:
          name: scorecard
          path: |
            *.json
            northstar.md
      - name: hard rule (no added mid-play cuts)
        run: |
          base=""; [ -f base.json ] && base="--base base.json"
          python head/scripts/ci_report.py --head head.json $base --out scorecard.md
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [lint, data, e2e, test, test-results, scorecard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: "{lint,pytest-3.12,scorecard}"
          merge-multiple: true
        continue-on-error: true
      - name: build the comment
        env:
          DATA_AVAILABLE: ${{ needs.data.outputs.available }}
          JOBS: "Jobs: lint ${{ needs.lint.result }}, e2e nights ${{ needs.e2e.result }}, unit tests ${{ needs.test.result }} (3.12 + 3.13, 4 shards each), shard coverage and playbooks ${{ needs.test-results.result }}, scorecard ${{ needs.scorecard.result }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          args=()
          [ -f results/pytest-3.12.xml ] && args+=(--junit results/pytest-3.12.xml)
          [ -f results/lint-status.txt ] && args+=(--lint results/lint.txt --lint-status "$(cat results/lint-status.txt)")
          if [ "$DATA_AVAILABLE" = "true" ]; then
            args+=(--head results/head.json)
            [ -f results/base.json ] && args+=(--base results/base.json)
          else
            args+=(--note "Scorecards skipped: the pinned eval dataset ($EVAL_DATA_TAG) is not published yet.")
          fi
          [ -f results/northstar.md ] && args+=(--section results/northstar.md)
          [ -f results/perf-head.json ] && args+=(--perf results/perf-head.json)
          [ -f results/perf-base.json ] && args+=(--perf-base results/perf-base.json)
          jarg=(); [ -f results/pytest-3.12.xml ] && jarg=(--junit results/pytest-3.12.xml)
          python scripts/playbook_coverage.py "${jarg[@]}" --md playbooks.md || echo "::error::playbook coverage failed"
          [ -f playbooks.md ] && args+=(--section playbooks.md)
          args+=(--note "$JOBS")
          python scripts/ci_report.py "${args[@]}" --out comment.md || true
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: post or update the PR comment
        if: github.event_name == 'pull_request'
        # A PR from a fork gets a read-only token: the numbers stay in the run summary instead.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- redzone-ci -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
