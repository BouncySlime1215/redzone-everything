# CI for every pull request: tests on Linux, ruff for real errors, and a fast scorecard smoke run
# on the pinned eval dataset (PR vs base, same data). The numbers go into one PR comment that each
# push updates. Free tier only: public repo, GitHub-hosted ubuntu runners, the built-in token.
name: CI

on:
  pull_request:
  push:
    branches: [codex/resume-redzone, integration/next, integration/release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The pinned eval dataset (see the "Pin one eval dataset" work): a release asset, cached here.
  EVAL_DATA_TAG: eval-data-v1
  EVAL_DATA_ASSET: eval-archive.tgz
  PYTHONDONTWRITEBYTECODE: "1"
  # The integration train gets every scorecard in full; other PRs get the fast smoke slice.
  RZ_SCORECARD_FULL: ${{ (github.base_ref == 'integration/next' || github.ref == 'refs/heads/integration/next' || github.ref == 'refs/heads/integration/release' || github.event_name == 'workflow_dispatch') && '1' || '0' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - name: ruff (real errors only, rules in pyproject.toml)
        run: |
          set +e
          ruff check --output-format concise . > lint.txt 2>&1
          echo $? > lint-status.txt
          cat lint.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: lint
          path: lint*.txt
      - name: fail on lint errors
        run: test "$(cat lint-status.txt)" = 0
      - name: contract kernel (new violations fail; baseline in docs/contract_baseline.json)
        run: python scripts/contract_check.py

  memory:
    # CLAUDE.md and docs/memory/ links resolve; a PR that changes a default or a gate also adds a
    # dated line to docs/memory/decisions.md (scripts/check_memory.py, CLAUDE.md "Memory").
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: memory links and decisions log
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/check_memory.py --base "origin/$BASE_REF"
          else
            python scripts/check_memory.py
          fi
      - name: state machine doc is current
        # redzone/machines/ specs -> docs/state-machines.md (stdlib only, no install needed).
        run: python scripts/state_machines.py --check
      - name: agent reports follow docs/STANDARD.md (front matter, ids, generated index)
        run: pip install pyyaml >/dev/null 2>&1 || true; python scripts/doc_index.py --check
      - name: no edits inside another agent's open claim
        # docs/coordination.md "Claims": one writer per file across parallel agents.
        if: ${{ github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/claims.py check --base "origin/$BASE_REF"
      - name: every commit says why
        if: ${{ github.base_ref != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/commit_why.py --base "origin/$BASE_REF"

  graders:
    # docs/grading.md: graders are frozen by the integrator (G1), experiments are pre-registered (G2)
    # and a running experiment keeps its goalposts (G3). scripts/grading_check.py.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: grader freeze, pre-registration, goalposts
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/grading_check.py --base "origin/$BASE_REF"
          else
            python scripts/grading_check.py
          fi
      - name: license tags (F8, personal-use data)
        run: python scripts/license_check.py
      - name: Context-only label leak check (v17)
        run: python scripts/label_leak_check.py

  data:
    # Fetch the pinned dataset once per tag, verify its sha256, and keep it in the Actions cache.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      available: ${{ steps.fetch.outputs.available }}
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: eval-data
          key: eval-data-${{ env.EVAL_DATA_TAG }}-v1
      - name: download and verify
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            mkdir -p eval-data
            if ! gh release download "$EVAL_DATA_TAG" -R "$GITHUB_REPOSITORY" -D eval-data \
                 -p "$EVAL_DATA_ASSET" -p "$EVAL_DATA_ASSET.sha256"; then
              echo "::warning::pinned eval dataset $EVAL_DATA_TAG is not published yet; scorecard smoke skipped"
              rm -rf eval-data
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          cd eval-data
          # The .sha256 file names the asset; check only that line, by our asset name.
          grep -E "[[:space:]]\*?$EVAL_DATA_ASSET\$" "$EVAL_DATA_ASSET.sha256" | sha256sum -c -
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.fetch.outputs.available == 'true'
        with:
          name: eval-data
          path: eval-data
          retention-days: 1

  test:
    needs: data
    # Tests run even if the dataset job failed (a bad checksum must not hide test results).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45   # base took 19m50s on 3.12 (Nov 4 12:12 run): three replayed-night tests (~3 min each);
                          # +10 for a slow apt mirror (16 and 21 min on Nov 4), which the apt step now also caps;
                          # +5: with ~20 PRs at once (go wide, Nov 4) one leg ran past 30 min on slow runners
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: system tools (PortAudio for sounddevice, ffmpeg for the catch-up reel, as on the Mac)
        # A slow mirror took 16-21 min here (Nov 4) and starved pytest of the job's time: cap each try at
        # 6 min, retry once, with apt's own per-request timeout and retries.
        timeout-minutes: 14
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for i in 1 2; do
            timeout 360 sh -c "sudo apt-get $APT update -qq && sudo apt-get $APT install -y --no-install-recommends libportaudio2 ffmpeg" && exit 0
            echo "::warning::apt try $i timed out or failed, retrying"
          done
          exit 1
      - run: pip install -r requirements-ci.txt    # requirements.txt + pandas/pyarrow for the data-crew shard tests
      - uses: actions/download-artifact@v4
        if: needs.data.outputs.available == 'true'
        with:
          name: eval-data
          path: eval-data
      - name: unpack pinned data (archive-backed tests run when it is there)
        if: needs.data.outputs.available == 'true'
        run: tar -xzf "eval-data/$EVAL_DATA_ASSET"
      - name: leakage checks (research 05 §3; PENDING never fails, FAIL does)
        run: python scripts/leak_check.py
      - name: end-to-end replayed night (when the suite has it)
        # The whole-night system test (real Engine + Controller + fakes) is the integration gate:
        # run it on its own first so its result is visible apart from the unit tests.
        run: |
          shopt -s nullglob
          e2e=(tests/test_e2e*.py)
          if [ ${#e2e[@]} -eq 0 ]; then echo "no end-to-end night test in this branch yet"; exit 0; fi
          python -m pytest -q -rs -p no:cacheprovider --junitxml=e2e-${{ matrix.python }}.xml "${e2e[@]}"
      - name: pytest (mac_only tests are skipped by name on Linux; the e2e nights ran in the step above)
        # The e2e nights take ~3 min each; running them twice pushed the job past its limit (Nov 4, #145, #173).
        run: python -m pytest -q -rs -p no:cacheprovider --ignore-glob='tests/test_e2e*.py' --junitxml=unit-${{ matrix.python }}.xml
      - name: one junit report (unit + e2e) for playbook coverage and the CI comment
        if: always()
        run: |
          python - "${{ matrix.python }}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          py = sys.argv[1]
          root = ET.Element("testsuites")
          for f in (f"e2e-{py}.xml", f"unit-{py}.xml"):
              if Path(f).exists():
                  r = ET.parse(f).getroot()
                  root.extend(r.iter("testsuite") if r.tag == "testsuites" else [r])
          ET.ElementTree(root).write(f"pytest-{py}.xml", encoding="utf-8", xml_declaration=True)
          PY
      - name: playbook coverage (a `done` entry must have a marked test that passed)
        run: python scripts/playbook_coverage.py --junit pytest-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python }}
          path: pytest-${{ matrix.python }}.xml

  scorecard:
    needs: data
    if: needs.data.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: head/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libportaudio2 ffmpeg
      - run: pip install -r head/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: eval-data
          path: eval-data
      - name: one copy of the pinned data, linked into both checkouts
        run: |
          mkdir pinned && tar -xzf "eval-data/$EVAL_DATA_ASSET" -C pinned
          for co in head base; do
            [ -d "$co" ] || continue
            mkdir -p "$co/data"
            for d in pinned/data/*; do
              # Copy small files (eval_config.yaml etc.) so a scorecard can't change the pin through
              # a link; link the big archive folders.
              if [ -d "$d" ]; then ln -sfn "$PWD/$d" "$co/data/$(basename "$d")"; else cp "$d" "$co/data/"; fi
            done
          done
      - name: smoke run, PR
        run: python head/scripts/ci_scorecard.py --root head --out head.json
      - name: smoke run, base (same slice, same data)
        if: github.event_name == 'pull_request'
        run: python head/scripts/ci_scorecard.py --root base --out base.json
      - name: RAM/CPU of the decide() tick, PR vs base (scripts/perf_probe.py)
        continue-on-error: true
        run: |
          python head/scripts/perf_probe.py --root head --json perf-head.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python head/scripts/perf_probe.py --root base --json perf-base.json || true
          fi
      - name: North Star on dev-test nights, PR vs base (scripts/northstar.py; the locked set never goes in a PR delta)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python head/scripts/northstar.py --root head --split dev --no-write --json ns-head.json
          python head/scripts/northstar.py --root base --split dev --no-write --json ns-base.json
          python head/scripts/northstar.py --delta ns-head.json ns-base.json --md northstar.md
          cat northstar.md >> "$GITHUB_STEP_SUMMARY"
      - name: release gate on the LOCKED test split ("95% good minimum" + no overfitting, docs/architecture.md)
        # Report on every run; it only FAILS the job on the release PR (into codex/resume-redzone).
        # PENDING gates (not measurable yet) never count as passing. --robust adds sync +-3 s and a
        # dropping/late feed; those cards must pass the same hard gates.
        run: |
          python head/scripts/ci_scorecard.py --root head --split test --robust --no-resync --out locked.json
          set +e
          python head/scripts/release_gate.py locked.json --baseline head/docs/gate_baseline.json --md gate.md
          rc=$?
          set -e
          { echo "#### Release gate (LOCKED test split + robustness)"; cat gate.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" != "0" ] && [ "${{ github.base_ref }}" = "codex/resume-redzone" ]; then
            echo "::error::release gate failed on the locked test split"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: |
            *.json
            northstar.md
      - name: hard rule (no added mid-play cuts)
        run: |
          base=""; [ -f base.json ] && base="--base base.json"
          python head/scripts/ci_report.py --head head.json $base --out scorecard.md
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [lint, data, test, scorecard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: "{lint,pytest-3.12,scorecard}"
          merge-multiple: true
        continue-on-error: true
      - name: build the comment
        env:
          DATA_AVAILABLE: ${{ needs.data.outputs.available }}
          JOBS: "Jobs: lint ${{ needs.lint.result }}, tests ${{ needs.test.result }} (3.12 + 3.13), scorecard ${{ needs.scorecard.result }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          args=()
          [ -f results/pytest-3.12.xml ] && args+=(--junit results/pytest-3.12.xml)
          [ -f results/lint-status.txt ] && args+=(--lint results/lint.txt --lint-status "$(cat results/lint-status.txt)")
          if [ "$DATA_AVAILABLE" = "true" ]; then
            args+=(--head results/head.json)
            [ -f results/base.json ] && args+=(--base results/base.json)
          else
            args+=(--note "Scorecards skipped: the pinned eval dataset ($EVAL_DATA_TAG) is not published yet.")
          fi
          [ -f results/northstar.md ] && args+=(--section results/northstar.md)
          [ -f results/perf-head.json ] && args+=(--perf results/perf-head.json)
          [ -f results/perf-base.json ] && args+=(--perf-base results/perf-base.json)
          jarg=(); [ -f results/pytest-3.12.xml ] && jarg=(--junit results/pytest-3.12.xml)
          python scripts/playbook_coverage.py "${jarg[@]}" --md playbooks.md || echo "::error::playbook coverage failed"
          [ -f playbooks.md ] && args+=(--section playbooks.md)
          args+=(--note "$JOBS")
          python scripts/ci_report.py "${args[@]}" --out comment.md || true
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: post or update the PR comment
        if: github.event_name == 'pull_request'
        # A PR from a fork gets a read-only token: the numbers stay in the run summary instead.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '<!-- redzone-ci -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
