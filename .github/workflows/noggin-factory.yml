# Noggin data factory + Timing v1 training on a free GitHub runner (never the Mac, never GPU quota).
# Builds the labeled dead-window table from public play-by-play, trains the hazard, grades it on the
# factory's own unseen nights, and uploads the table, the model and the report as artifacts.
# Nothing is committed: a model reaches the repo only through a reviewed PR.
name: noggin-factory
on:
  push:
    # noggin-factory/<league> branches build that league (e.g. noggin-factory/nhl: ESPN summaries, which
    # this cloud container can't reach); integration/next rebuilds the NBA table when the factory changes.
    branches: [integration/next, "noggin-factory/**"]
    paths: ["redzone/noggin/factory.py", "redzone/noggin/features.py", "redzone/noggin/timing*.py",
            "scripts/noggin_factory.py", "scripts/train_noggin_timing.py", ".github/workflows/noggin-factory.yml"]
  workflow_dispatch:
    inputs:
      league: {default: nba}
      seasons: {default: "2013-2026"}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pandas pyarrow lightgbm requests
      - name: league
        run: |
          L="${{ inputs.league }}"
          case "$GITHUB_REF_NAME" in noggin-factory/*) L="${L:-${GITHUB_REF_NAME#noggin-factory/}}";; esac
          L="${L:-nba}"
          case "$L" in nhl) D=2011-2027;; nfl) D=2011-2025;; *) D=2013-2026;; esac
          echo "LEAGUE=$L" >> "$GITHUB_ENV"
          S="${{ inputs.seasons }}"
          echo "SEASONS=${S:-$D}" >> "$GITHUB_ENV"
      - name: factory
        run: python scripts/noggin_factory.py "$LEAGUE" --seasons "$SEASONS" --raw /tmp/raw --out data/noggin --jobs 3
      - name: train + grade
        run: python scripts/train_noggin_timing.py "$LEAGUE" --data data/noggin --out data/noggin/models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noggin-${{ env.LEAGUE }}
          path: |
            data/noggin/*.json
            data/noggin/*.parquet
            data/noggin/models/*.npz
          retention-days: 14
